<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>덧뵈기, 나만의 탈춤 프로토타입</title>
  <style>
    :root{color-scheme:dark;--cream:#fff3d3;--gold:#efb94e;--red:#bd3d37;--green:#4a9a76;--blue:#4b78a7;--panel:#17151bf2;--line:#fff1ca38}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b0a0d;color:var(--cream);font-family:"Malgun Gothic","Noto Sans KR",sans-serif}button{font:inherit}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% 8%,#492b31,#0b0a0d 60%)}
    #app{position:relative;width:min(100vw,177.777vh);height:min(56.25vw,100vh);overflow:hidden;background:#18151a;box-shadow:0 25px 80px #000a;isolation:isolate}.screen{position:absolute;inset:0;display:none}.screen.on{display:flex}
    #home{padding:4.4% 5.2%;flex-direction:column;background:radial-gradient(circle at 17% 25%,#81482e55,transparent 28%),radial-gradient(circle at 84% 28%,#3f795755,transparent 28%),linear-gradient(145deg,#36232a,#151318 59%)}
    .home-head{display:flex;justify-content:space-between;align-items:flex-end}.kicker{margin:0 0 .5em;color:var(--gold);font-size:clamp(14px,1.1vw,22px);font-weight:900;letter-spacing:.18em}.home-head h1{margin:0;font-family:Batang,serif;font-size:clamp(42px,4.3vw,82px);letter-spacing:-.06em}.home-head>p{width:39%;margin:0;color:#d6c9af;font-size:clamp(14px,1.05vw,20px);line-height:1.55}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4%;flex:1;min-height:0;margin-top:3%}.card{position:relative;overflow:hidden;padding:0;border:1px solid var(--line);border-radius:24px;color:var(--cream);text-align:left;background:linear-gradient(155deg,var(--c1),var(--c2));cursor:pointer;transition:.2s}.card:not(:disabled):hover,.card:not(:disabled):focus-visible{transform:translateY(-7px);border-color:var(--gold);outline:0}.card:disabled{cursor:not-allowed;filter:grayscale(.7);opacity:.52}.mask{position:absolute;left:29%;top:8%;width:42%;aspect-ratio:.9;border-radius:47% 53%;background:var(--mask);box-shadow:inset -16px -11px #0003,0 18px 35px #0006}.mask:before{content:"";position:absolute;left:18%;right:18%;top:39%;height:7%;border-radius:50%;background:#20151c;box-shadow:0 48px 0 -5px #642226}.mask:after{content:"";position:absolute;left:48%;top:17%;width:8%;height:55%;border-radius:50%;background:#7e4a3d77}.card-copy{position:absolute;inset:auto 0 0;padding:18% 8% 7%;background:linear-gradient(transparent,#0e0d10f4 38%)}.card-copy small{color:var(--gold);font-weight:900;letter-spacing:.12em}.card-copy h2{margin:.18em 0;font-size:clamp(27px,2.35vw,45px);letter-spacing:-.05em}.card-copy p{margin:.3em 0 .8em;color:#d7cdb8;font-size:clamp(13px,.93vw,18px);line-height:1.45}.chip{display:inline-block;padding:.4em .7em;border-radius:999px;background:#ffffff14}.chip b{color:var(--gold)}
    #play{flex-direction:column}.topbar{position:absolute;z-index:30;left:2.4%;right:2.4%;top:2.3%;height:6%;display:flex;align-items:center;justify-content:space-between}.scene-title{display:flex;gap:.9em;align-items:center;font-size:clamp(17px,1.2vw,23px);font-weight:900}.scene-title small{color:var(--gold);letter-spacing:.12em}.quit{padding:.55em .85em;border:1px solid var(--line);border-radius:11px;color:var(--cream);background:#111015aa;cursor:pointer;font-weight:800}.quit:hover{border-color:var(--gold)}
    .stage{position:absolute;inset:0 0 25%;overflow:hidden;background:linear-gradient(#303841 0 57%,#8a603e 57% 60%,#302227 60%)}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#08070ba8,transparent 17% 83%,#08070ba8),radial-gradient(ellipse at 50% 78%,#ffd2743c,transparent 45%)}.curtain{position:absolute;z-index:5;top:0;width:14%;height:78%;background:linear-gradient(90deg,#4b151d,#9a3034 50%,#51161f);filter:drop-shadow(10px 8px 12px #0007)}.curtain.left{left:0;clip-path:polygon(0 0,100% 0,75% 100%,0 91%)}.curtain.right{right:0;transform:scaleX(-1);clip-path:polygon(0 0,100% 0,75% 100%,0 91%)}.floor-mark{position:absolute;z-index:3;left:50%;bottom:8%;width:22%;height:10%;transform:translateX(-50%);border:3px dashed #efb94e77;border-radius:50%;opacity:0}.floor-mark.on{opacity:1;animation:pulse 1s infinite alternate}
    .cast{position:absolute;inset:0;z-index:9}.actor{--x:50%;--y:57%;--scale:1;--robe:#6c5141;--face:#d7b078;position:absolute;left:var(--x);top:var(--y);width:12%;aspect-ratio:.62;transform:translate(-50%,-50%) scale(var(--scale));opacity:0;transition:left .42s,top .42s,transform .35s,opacity .25s,filter .25s}.actor.show{opacity:1}.actor.back{--scale:.77;opacity:.64}.actor.focus{--scale:1.08;filter:drop-shadow(0 0 18px #efb94e88)}.actor.hit{animation:shake .2s 4}.actor.dance{animation:bob .55s infinite alternate}.head{position:absolute;z-index:2;left:22%;top:4%;width:56%;aspect-ratio:.9;border-radius:48% 52%;background:var(--face);box-shadow:inset -10px -8px #0002,0 9px 15px #0006}.head:before{content:"";position:absolute;left:18%;right:18%;top:39%;height:7%;border-radius:50%;background:#20151c;box-shadow:0 20px 0 -3px #6a2527}.head:after{content:"";position:absolute;left:48%;top:16%;width:8%;height:56%;border-radius:50%;background:#75443677}.body{position:absolute;left:18%;right:18%;top:38%;bottom:0;border-radius:40% 40% 18% 18%;background:var(--robe);box-shadow:inset -14px -9px #0003,0 16px 22px #0005}.arm{position:absolute;z-index:-1;top:43%;width:22%;height:43%;border-radius:999px;background:var(--robe);transform-origin:50% 10%}.arm.a{left:5%;transform:rotate(18deg)}.arm.b{right:5%;transform:rotate(-18deg)}.actor.push .arm.a{transform:rotate(-58deg)}.actor.push .arm.b{transform:rotate(58deg)}.name{position:absolute;left:50%;bottom:-10%;transform:translateX(-50%);padding:.28em .65em;border-radius:999px;background:#0d0c10da;font-size:clamp(11px,.78vw,15px);font-weight:900;white-space:nowrap}.actor[data-role=장쇠]{--robe:#397865}.actor[data-role=꺽쇠]{--robe:#32638e;--face:#e1ad49}.actor[data-role=옴탈]{--robe:#8d3037;--face:#c84b3e}
    .action-cue{position:absolute;z-index:16;left:50%;top:36%;transform:translate(-50%,-50%);display:none;text-align:center;pointer-events:none}.action-cue.on{display:block}.action-cue strong{display:block;font-family:Batang,serif;font-size:clamp(42px,5vw,96px);text-shadow:0 8px 25px #0009}.action-cue span{display:inline-block;margin-top:.7em;padding:.45em .8em;border-radius:999px;background:#111015dd;color:var(--gold);font-weight:900}.arrow{font-size:1.3em;color:var(--gold)}
    .choices{position:absolute;z-index:35;left:4%;right:4%;bottom:26.5%;display:none;justify-content:center;gap:1%}.choices.on{display:flex}.choice{min-width:15%;min-height:68px;padding:.8em 1.2em;border:2px solid #ffffff45;border-radius:17px;color:var(--cream);background:#19161def;cursor:pointer;font-size:clamp(15px,1.05vw,21px);font-weight:900}.choice:hover,.choice:focus-visible{border-color:var(--gold);background:#68352d;outline:0}.choice.primary{background:#8d302e}.choice.safe{background:#356f5c}
    .dialogue{position:absolute;z-index:28;left:0;right:0;bottom:0;height:25%;display:grid;grid-template-columns:15% 1fr auto;gap:2%;align-items:center;padding:1.45% 3.1%;border-top:2px solid #efb94e66;background:var(--panel)}.speaker-wrap{align-self:center}.kind{display:inline-block;margin-bottom:.45em;padding:.28em .55em;border-radius:999px;background:#ffffff12;color:#d7cbb4;font-size:clamp(10px,.7vw,13px);font-weight:900}.speaker{color:var(--gold);font-size:clamp(19px,1.5vw,29px);font-weight:900}.speaker.guide{color:#84d7b0}.text{max-height:100%;overflow:auto;padding-right:1%;font-size:clamp(19px,1.52vw,30px);font-weight:700;line-height:1.48;letter-spacing:-.025em;scrollbar-width:thin}.controls{display:flex;gap:.5em;align-items:center}.next,.sentence{padding:.8em .9em;border:1px solid var(--line);border-radius:12px;color:var(--cream);background:#ffffff12;cursor:pointer;font-weight:900}.next:hover,.sentence:hover{border-color:var(--gold)}.sentence{display:none}.sentence.on{display:block}
    .dev{position:absolute;z-index:50;top:10%;right:2.3%;display:none;width:23%;padding:1%;border:1px solid var(--line);border-radius:14px;background:#0e0d11e8;font-size:clamp(10px,.72vw,14px);line-height:1.55}.dev.on{display:block}.dev b{color:var(--gold)}.dev-toggle{position:absolute;z-index:51;right:2.3%;top:10%;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;color:var(--cream);background:#0d0c10cc;cursor:pointer}.dev.on+.dev-toggle{right:26%}.modal{position:absolute;z-index:80;inset:0;display:none;place-items:center;background:#08070bc9}.modal.on{display:grid}.modal-box{width:min(52%,850px);padding:3%;border:1px solid var(--line);border-radius:22px;background:#1a171e;text-align:center;box-shadow:0 20px 60px #0009}.modal-box h2{margin:0 0 .6em;font-size:clamp(28px,2.4vw,46px)}.modal-box p{color:#d8cdb8;font-size:clamp(15px,1.1vw,21px);line-height:1.55}.modal-actions{display:flex;justify-content:center;gap:1em;margin-top:1.5em}.modal-actions button{padding:.8em 1.2em;border:1px solid var(--line);border-radius:12px;color:var(--cream);background:#ffffff12;cursor:pointer}.modal-actions .primary{background:#8d302e}
    @keyframes bob{to{margin-top:-14px}}@keyframes shake{25%{margin-left:-12px}75%{margin-left:12px}}@keyframes pulse{to{transform:translateX(-50%) scale(1.08);opacity:1}}
    @media(max-width:1050px),(max-height:620px){.choice{min-height:48px}.dialogue{grid-template-columns:14% 1fr auto}.next,.sentence{padding:.6em}.dev{width:29%}.dev.on+.dev-toggle{right:32%}}
  </style>
</head>
<body>
<main id="app">
  <section id="home" class="screen on">
    <div class="home-head"><div><p class="kicker">원전 재담과 몸동작 체험</p><h1>덧뵈기, 나만의 탈춤</h1></div><p>마당 하나를 골라 원전 대사를 모두 따라가며 플레이 입력의 흐름을 확인합니다.</p></div>
    <div class="cards">
      <button class="card" data-start="omtal" style="--c1:#7b362f;--c2:#24191f;--mask:#c94c3e"><span class="mask"></span><span class="card-copy"><small>구현됨</small><h2>옴탈잡이</h2><p>재담 사이에 좌우 회피와 밀어내기를 체험합니다.</p><span class="chip">유저 배역 <b>꺽쇠</b></span></span></button>
      <button class="card" data-start="saennim" style="--c1:#5e4877;--c2:#221d28;--mask:#e4ceaa"><span class="mask"></span><span class="card-copy"><small>구현됨</small><h2>샌님잡이</h2><p>샌님의 말에서 허점을 골라 말뚝이의 재담으로 받아칩니다.</p><span class="chip">유저 배역 <b>말뚝이</b></span></span></button>
      <button class="card" data-start="meokjung" style="--c1:#486444;--c2:#1d1c20;--mask:#d1b178"><span class="mask"></span><span class="card-copy"><small>구현됨</small><h2>먹중잡이</h2><p>취발이 등장 뒤 몸짓이 달라지는 먹중을 지목합니다.</p><span class="chip">유저 배역 <b>취발이</b></span></span></button>
    </div>
  </section>
  <section id="play" class="screen">
    <div class="stage"><div class="curtain left"></div><div class="curtain right"></div><div id="floorMark" class="floor-mark"></div><div id="cast" class="cast"></div></div>
    <header class="topbar"><div class="scene-title"><small>둘째 마당</small><span>옴탈잡이</span></div><button id="quit" class="quit">그만두기</button></header>
    <div id="choices" class="choices"></div>
    <div class="dialogue"><div class="speaker-wrap"><div id="kind" class="kind"></div><div id="speaker" class="speaker"></div></div><div id="text" class="text"></div><div class="controls"><button id="prevSentence" class="sentence">이전 문장</button><button id="next" class="next">다음 ▶</button></div></div>
    <aside id="dev" class="dev"><b>개발자 시험 정보</b><div id="devText"></div></aside><button id="devToggle" class="dev-toggle" title="개발자 정보">D</button>
  </section>
  <div id="modal" class="modal"><div class="modal-box"><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalActions" class="modal-actions"></div></div></div>
</main>
<script src="덧뵈기-원전대사.js"></script><script src="덧뵈기-진행상태.js"></script><script src="덧뵈기-표시도구.js"></script>
<script>
const $=id=>document.getElementById(id);let sceneId='omtal',source,stateSet,states,rowMap;
let stateId='omtal-01',queue=[],queueIndex=0,pageIndex=0,shownLines=new Set(),ctx={};
const actorsByState={
 'omtal-01':['장쇠','꺽쇠'],'omtal-02':['장쇠','꺽쇠'],'omtal-03':['장쇠','꺽쇠','옴탈'],'omtal-04':['장쇠','꺽쇠','옴탈'],'omtal-05':['장쇠','꺽쇠','옴탈'],'omtal-06':['장쇠','꺽쇠','옴탈'],'omtal-07':['장쇠','꺽쇠','옴탈'],'omtal-08':['장쇠','꺽쇠','옴탈'],'omtal-09':['장쇠','꺽쇠','옴탈'],'omtal-10':['장쇠','꺽쇠','옴탈'],'omtal-11':['장쇠','꺽쇠','옴탈'],'omtal-12':['장쇠','꺽쇠','옴탈'],'omtal-13':['장쇠','꺽쇠','옴탈'],'omtal-14':['장쇠','꺽쇠','옴탈'],'omtal-15':['장쇠','꺽쇠','옴탈'],'omtal-16':['장쇠','꺽쇠']};
function design(text,speaker='장쇠'){return {kind:'설계 대사',speaker,text,pages:[text]}}function sourceItems(lines){const items=[];for(const line of lines){if(shownLines.has(line))continue;shownLines.add(line);const row=rowMap.get(line);if(!row)continue;for(const segment of row.segments.filter(segment=>segment.type==='dialogue')){const pages=DEOTBOEGI_DISPLAY.paginateSourceText(segment.text);items.push({kind:'원전 대사',speaker:segment.speaker,text:segment.text,pages,sourceLine:line})}}return items}function input(prompt,options){return {kind:'설계 대사',speaker:'장쇠',text:prompt,pages:[prompt],options}}
function parseDesignText(raw){
 if(!raw||raw==='없음')return[];
 const marked=[...raw.matchAll(/`\[([^\]]+)\]\s*([^`]+)`/g)];
 if(marked.length)return marked.map(([,speaker,text])=>design(text.trim(),speaker==='안내'?'장쇠':speaker));
 return[]
}
function stateSourceLines(id){return source.rows.filter(r=>r.stateIds.includes(id)).map(r=>r.sourceLine)}
function standardQueue(id){const state=states.get(id),lines=stateSourceLines(id);let items=[];if(sceneId==='omtal'&&['omtal-05','omtal-11','omtal-14','omtal-15'].includes(id))items.push(...sourceItems(lines),...parseDesignText(state.bottomText));else items.push(...parseDesignText(state.bottomText),...sourceItems(lines));return items}
function enter(id,options={}){stateId=id;queueIndex=0;pageIndex=0;queue=[];updateStage();if(sceneId!=='omtal'){queue=standardQueue(id);appendLinearInput(id);if(!queue.length)queue=[design('다음 장면으로 이어 가겠소.','장쇠')];render();return}if(id==='omtal-07'&&!options.resume){ctx.cycle=0;ctx.retry=0;startCycle();return}if(id==='omtal-09'){buildRetry();return}if(id==='omtal-08'){const successMore=ctx.successes>ctx.failures;queue=[design(successMore?'쫓아오는 재주는 있어도 잡는 재주는 없구나.':'제법 피하지만 아직 멀었다.',successMore?'꺽쇠':'옴탈')]}else queue=standardQueue(id);appendStateInput(id);if(!queue.length)queue=[design('다음 장면으로 이어 가겠소.','장쇠')];render()}
function appendLinearInput(id){const state=states.get(id),next=state.next.filter(target=>states.has(target));const go=target=>()=>enter(target);if(id.endsWith('-01')){queue.push(input('마당 전경을 살펴봤으면 체험을 시작하시오.',[['체험 시작',go(next[0]),'primary']]));return}if(id.endsWith('-02')){const prompt=sceneId==='saennim'?'표시된 영역에 손을 잠시 머물러 보시오.':'손가락으로 화면의 표시를 가리켜 보시오.';queue.push(input(prompt,[['인식됨',go(next[0]),'primary'],['인식되지 않음',linearRecognitionFail],['무입력',linearRecognitionFail]]));return}if(id==='saennim-10'){queue.push(input('샌님의 절 요구에서 다른 뜻으로 받아칠 표현을 고르시오.',[['‘절’을 고르기',()=>selectSaennim('strong','saennim-11'),'primary'],['‘하라’를 고르기',()=>selectSaennim('weak','saennim-11')],['무입력',()=>selectSaennim('none','saennim-11')]]));return}if(id==='saennim-13'){queue.push(input('그대로 따르면 샌님을 곤란하게 만들 표현을 고르시오.',[['‘빠짐없이’를 고르기',()=>selectSaennim('strong','saennim-14'),'primary'],['‘하는 대로’를 고르기',()=>selectSaennim('weak','saennim-14')],['무입력',()=>selectSaennim('none','saennim-14')]]));return}if(id==='meokjung-05'||id==='meokjung-08'){const success=id==='meokjung-05'?'meokjung-06':'meokjung-09',skip=id==='meokjung-05'?'meokjung-07':'meokjung-10';queue.push(input('취발이가 나온 뒤 몸짓이 달라진 인물을 가리키시오.',[['먹중을 제때 지목',()=>{ctx.captures++;enter(success)},'primary'],['너무 일찍 지목',()=>meokEarly(id,skip)],['늦음 또는 무입력',()=>enter(skip)],['모호함 또는 인식 끊김',()=>enter(skip)]]));return}if(next.length)queue.push(input('재담을 들었으면 다음 장면으로 이어 가겠소.',[['계속',go(next[0]),'primary']]));else queue.push(input(`${sceneId==='saennim'?'샌님잡이':'먹중잡이'} 한마당을 마쳤소.`,[['마당 선택으로',goHome,'safe']]));}
function selectSaennim(level,next){ctx.selections.push(level);const line=level==='strong'?'허점을 제대로 짚었소. 말뚝이가 능청스럽게 받아칠 것이오.':level==='weak'?'그 말도 받아칠 수 있소. 샌님의 반응을 잘 보시오.':'고르지 않아도 원전 재담은 그대로 이어지오.';queue=[design(line,'장쇠'),input('다음 재담으로 이어 가겠소.',[['계속',()=>enter(next),'primary']])];queueIndex=0;pageIndex=0;render()}
function linearRecognitionFail(){ctx.recognitionFails++;if(ctx.recognitionFails>=2)return recovery('손의 위치를 다시 확인했지만 인식되지 않았습니다.');queue=[design(sceneId==='saennim'?'손을 표시 영역에 천천히 머물러 보시오.':'팔을 뻗어 표시를 천천히 가리켜 보시오.','장쇠'),input('한 차례 더 확인해 보겠소.',[['인식됨',()=>enter(`${sceneId}-03`),'primary'],['다시 인식되지 않음',linearRecognitionFail]])];queueIndex=0;render()}
function meokEarly(id,skip){ctx.earlyCounts[id]=(ctx.earlyCounts[id]||0)+1;if(ctx.earlyCounts[id]>=2){enter(skip);return}queue=[design('아직 몸짓이 드러나지 않았소. 한 번 더 보고 움직임이 달라질 때 가리키시오.','장쇠'),input('다시 관찰하시오.',[['다시 지목하기',()=>enter(id),'primary'],['기다리기',()=>enter(skip)]])];queueIndex=0;pageIndex=0;render()}
function appendStateInput(id){if(id==='omtal-01')queue.push(input('마당 전경을 살펴봤으면 체험을 시작하시오.',[['체험 시작',()=>enter('omtal-02')]]));if(id==='omtal-02')queue.push(input('화면 가운데에 서서 좌우로 가볍게 움직여 보시오.',[['인식됨',()=>enter('omtal-03'),'primary'],['인식되지 않음',recognitionFail],['무입력',recognitionFail]]));if(id==='omtal-03')queue.push(input('옴탈이 오는 쪽을 잘 보시오.',[['첫 접근 보기',()=>enter('omtal-04')]]));if(id==='omtal-04')queue.push(input('옴탈이 왼쪽에서 오니 오른쪽으로 피하시오.',[['왼쪽으로 이동',()=>enter('omtal-06')],['오른쪽으로 이동',()=>enter('omtal-05'),'primary'],['무입력',()=>enter('omtal-06')]]));if(id==='omtal-05')queue.push(input('좋소. 이제 연달아 오는 옴탈을 피하시오.',[['연속 회피 시작',()=>enter('omtal-07')]]));if(id==='omtal-06')queue.push(input(ctx.retry?'이번에는 옴탈이 천천히 오니 반대쪽으로 다시 피하시오.':'같은 쪽에서 다시 오니 반대쪽으로 피하시오.',[['반대쪽으로 피하기',()=>enter('omtal-05'),'primary'],['다시 놓치기',firstEvadeRetry],['무입력',firstEvadeRetry]]));if(id==='omtal-08')queue.push(input('이제 피하기는 익혔소. 밀어내는 동작을 배워 보시오.',[['퇴치 동작 배우기',()=>enter('omtal-10')]]));if(id==='omtal-10')queue.push(input('두 팔을 앞으로 뻗은 뒤 편한 자세로 돌아오시오.',[['동작과 중립 자세 인식',()=>enter('omtal-11'),'primary'],['인식되지 않음',pushRecognitionFail],['무입력',pushRecognitionFail]]));if(id==='omtal-11')queue.push(input('옴탈이 멈춰 버티는 순간 힘껏 밀어내시오.',[['정지 뒤 밀어내기',()=>enter('omtal-12'),'primary'],['너무 이르거나 늦음',()=>enter('omtal-13')],['무입력',()=>enter('omtal-13')]]));if(id==='omtal-12')queue.push(input('옴탈이 다시 일어났소. 마지막으로 피하고 밀어내시오.',[['마지막 공방',()=>enter('omtal-14')]]));if(id==='omtal-13')queue.push(input(ctx.firstPushFails>=1?'이번에는 옴탈이 멈춘 뒤 천천히 두 팔을 뻗어 보시오.':'옴탈이 멈추는 순간을 다시 잘 보시오.',[['정지 뒤 밀어내기',()=>enter('omtal-12'),'primary'],['다시 놓치기',firstPushRetry],['무입력',firstPushRetry]]));if(id==='omtal-14')queue.push(input(ctx.finalFails?'한 번 더 기회를 주겠소. 실제로 오는 쪽의 반대로 피한 뒤 멈추면 밀어내시오.':'가짜 움직임에 속지 말고 실제로 오는 쪽의 반대로 피한 뒤, 멈추면 밀어내시오.',[['회피 뒤 밀어내기',()=>enter('omtal-15'),'primary'],['회피 또는 밀어내기 실패',finalRetry],['무입력',finalRetry]]));if(id==='omtal-15')queue.push(input('옴탈이 물러났소. 마당을 마무리하겠소.',[['마당 마무리',()=>enter('omtal-16')]]));if(id==='omtal-16')queue.push(input(ctx.finalFailure?'끝까지 함께했으니 이것으로 마당을 마치겠소.':'옴탈잡이 한마당을 마쳤소.',[['마당 선택으로',goHome,'safe']]));}
function recognitionFail(){ctx.recognitionFails++;if(ctx.recognitionFails>=2)return recovery('위치와 동작을 다시 확인했지만 인식되지 않았습니다.');queue=[design('화면 가운데에 다시 서서 몸을 움직여 보시오.','장쇠'),input('한 차례 더 확인해 보겠소.',[['인식됨',()=>enter('omtal-03'),'primary'],['다시 인식되지 않음',recognitionFail]])];queueIndex=0;render()}
function firstEvadeRetry(){ctx.retry++;if(ctx.retry>=2){ctx.retry=0;queue=[design('내가 피하는 동작을 보여 주겠소. 잘 보고 다음 움직임을 준비하시오.','장쇠'),input('준비됐으면 연속 회피를 시작하시오.',[['연속 회피',()=>enter('omtal-07')]])]}else{enter('omtal-06');return}queueIndex=0;render()}
function startCycle(){if(ctx.cycle>=stateSet.sourceSchedule.blocks.length)return enter('omtal-08');stateId='omtal-07';updateStage();const block=stateSet.sourceSchedule.blocks[ctx.cycle];const direction=ctx.cycle%2===0?'왼쪽':'오른쪽';const correct=direction==='왼쪽'?'오른쪽':'왼쪽';queue=[...sourceItems(block),input(`새로운 접근 ${ctx.cycle+1}/9: 옴탈이 ${direction}에서 옵니다. 반대쪽으로 피하세요.`,[[`${correct}으로 피하기`,cycleSuccess,'primary'],[`${direction}으로 이동`,()=>{ctx.retry=0;enter('omtal-09')}],['무입력',()=>{ctx.retry=0;enter('omtal-09')}]],`${direction==='왼쪽'?'←':'→'} 접근, 반대쪽 회피`)];queueIndex=0;pageIndex=0;render()}
function cycleSuccess(){ctx.successes++;ctx.cycle++;startCycle()}function buildRetry(){const direction=ctx.cycle%2===0?'왼쪽':'오른쪽',correct=direction==='왼쪽'?'오른쪽':'왼쪽';const fail=()=>{ctx.retry++;if(ctx.retry>=2){ctx.failures++;ctx.cycle++;ctx.retry=0;startCycle()}else buildRetry()};queue=[...parseDesignText(states.get('omtal-09').bottomText),input(ctx.retry?'이번에는 천천히 오니 반대쪽으로 한 번 더 피하시오.':'같은 쪽에서 다시 오니 반대쪽으로 피하시오.',[[`${correct}으로 피하기`,()=>{ctx.successes++;ctx.cycle++;ctx.retry=0;startCycle()},'primary'],['다시 놓치기',fail],['무입력',fail]])];queueIndex=0;render()}
function pushRecognitionFail(){ctx.pushRecognitionFails++;if(ctx.pushRecognitionFails>=2)return recovery('손과 팔 위치를 다시 확인했지만 인식되지 않았습니다.');queue=[design('손과 팔을 화면 안에서 크게 움직여 보시오.','장쇠'),input('한 차례 더 확인해 보겠소.',[['동작과 중립 자세 인식',()=>enter('omtal-11'),'primary'],['다시 인식되지 않음',pushRecognitionFail]])];queueIndex=0;render()}
function firstPushRetry(){ctx.firstPushFails++;if(ctx.firstPushFails>=2){queue=[design('내가 밀어내는 동작을 보여 주겠소. 잘 보고 마지막 공방을 준비하시오.','장쇠'),input('준비됐으면 마지막 공방을 시작하시오.',[['마지막 공방',()=>enter('omtal-14')]])];queueIndex=0;render()}else enter('omtal-13')}
function finalRetry(){ctx.finalFails++;if(ctx.finalFails>=2){ctx.finalFailure=true;queue=[design('이번에는 내가 옴탈을 물러나게 하고 마당을 마무리하겠소.','장쇠'),input('마무리할 준비가 됐으면 계속하시오.',[["마당 마무리",()=>enter('omtal-16')]])];queueIndex=0;render()}else enter('omtal-14')}
function nextItem(){const item=queue[queueIndex];if(item&&pageIndex<item.pages.length-1){pageIndex++;render();return}if(queueIndex<queue.length-1){queueIndex++;pageIndex=0;render();return}const automatic={'omtal-03':'omtal-04','omtal-08':'omtal-10'}[stateId];if(automatic)enter(automatic)}
function prevSentence(){if(pageIndex>0){pageIndex--;render()}else if(queueIndex>0){queueIndex--;pageIndex=queue[queueIndex].pages.length-1;render()}}
function render(){const item=queue[queueIndex]||design('잠시 기다려 주시오.');$('kind').textContent=item.speaker==='장쇠'?'장쇠 안내':'등장인물 대사';$('speaker').textContent=item.speaker;$('speaker').classList.remove('guide');$('text').textContent=item.pages[pageIndex]??item.text;$('choices').innerHTML='';$('choices').classList.toggle('on',!!item.options);if(item.options)item.options.forEach(([label,action,cls])=>{const b=document.createElement('button');b.className=`choice ${cls||''}`;b.textContent=label;b.onclick=action;$('choices').appendChild(b)});$('next').style.display=item.options?'none':'block';$('prevSentence').classList.toggle('on',pageIndex>0||queueIndex>0);$('prevSentence').textContent=pageIndex>0?'이전 문장':'이전 항목';updateDev(item);}
function updateStage(){const state=states.get(stateId);const known=['장쇠','꺽쇠','옴탈','말뚝이','샌님 셋','샌님','노친네','잽이','피조리 둘','취발이','먹중','전체 출연진'];let names=sceneId==='omtal'?(actorsByState[stateId]||[]):known.filter(name=>state?.cast.includes(name));names=names.flatMap(name=>name==='피조리 둘'?['피조리 1','피조리 2']:name==='샌님 셋'?['샌님 1','샌님 2','샌님 3']:name==='전체 출연진'?['출연진 1','출연진 2','출연진 3','출연진 4']:[name]).filter((name,index,list)=>!(name==='샌님'&&list.some(item=>item.startsWith('샌님 '))));const stateNo=Number(stateId.split('-')[1]);$('cast').innerHTML=names.map((name,index)=>{let cls='actor show';if(name==='장쇠'&&stateNo>=3)cls+=' back';if(['말뚝이','취발이'].includes(name)&&state?.cast.includes('대기'))cls+=' back';if(['saennim-15','saennim-18','saennim-19','meokjung-03','meokjung-07','meokjung-15','meokjung-16','meokjung-20','meokjung-21'].includes(stateId))cls+=' dance';if((stateId==='omtal-07'||stateId==='omtal-09'))cls+=name==='옴탈'?' dance':'';if(['omtal-10','omtal-11','omtal-13','omtal-14','omtal-15'].includes(stateId)&&name==='꺽쇠')cls+=' push';if(['omtal-05','omtal-12','omtal-15'].includes(stateId)&&name==='옴탈')cls+=' hit';const x=names.length===1?50:8+(84*index/(names.length-1));return `<div class="${cls}" data-role="${name}" style="--x:${x}%"><span class="head"></span><span class="body"><i class="arm a"></i><i class="arm b"></i></span><span class="name">${name.replace(/ \d+$/,'')}</span></div>`}).join('');$('floorMark').classList.toggle('on',stateId.endsWith('-02')||stateId==='omtal-10')}
function updateDev(item){const state=states.get(stateId),total=source.rows.length;const extra=sceneId==='omtal'?`<br>연속 회피: ${ctx.cycle}/9, 성공 ${ctx.successes}, 실패 ${ctx.failures}`:sceneId==='saennim'?`<br>선택: ${ctx.selections.length}/2`:`<br>포착: ${ctx.captures}/2`;$('devText').innerHTML=`상태: <b>${stateId}</b> ${state?.name||''}<br>표시: ${queueIndex+1}/${queue.length}, 문장 ${pageIndex+1}/${item.pages.length}<br>원전 처리: ${shownLines.size}/${total}행${extra}`}
function recovery(message){showModal('인식 복구',message,[['인식 확인 다시 시작',()=>{hideModal();if(sceneId==='omtal')enter(stateId==='omtal-02'?'omtal-02':'omtal-10');else enter(`${sceneId}-02`)}],['체험 종료',()=>{hideModal();goHome()},'primary']])}
function showModal(title,text,actions){$('modalTitle').textContent=title;$('modalText').textContent=text;$('modalActions').innerHTML='';actions.forEach(([label,fn,cls])=>{const b=document.createElement('button');b.textContent=label;b.className=cls||'';b.onclick=fn;$('modalActions').appendChild(b)});$('modal').classList.add('on')}
function hideModal(){$('modal').classList.remove('on')}function confirmQuit(){showModal('체험을 그만둘까요?','현재 진행은 저장되지 않습니다.',[['계속하기',hideModal],['그만두기',()=>{hideModal();goHome()},'primary']])}
function start(selected='omtal'){sceneId=selected;source=DEOTBOEGI_SOURCE.scenes[sceneId];stateSet=DEOTBOEGI_STATES.scenes[sceneId];states=new Map(stateSet.states.map(s=>[s.id,s]));rowMap=new Map(source.rows.map(r=>[r.sourceLine,r]));ctx={recognitionFails:0,pushRecognitionFails:0,firstPushFails:0,finalFails:0,cycle:0,retry:0,successes:0,failures:0,finalFailure:false,selections:[],captures:0,earlyCounts:{}};shownLines=new Set();$('home').classList.remove('on');$('play').classList.add('on');const titles={omtal:['둘째 마당','옴탈잡이'],saennim:['셋째 마당','샌님잡이'],meokjung:['넷째 마당','먹중잡이']};$('play').querySelector('.scene-title small').textContent=titles[sceneId][0];$('play').querySelector('.scene-title span').textContent=titles[sceneId][1];enter(`${sceneId}-01`)}
function goHome(){$('play').classList.remove('on');$('home').classList.add('on');$('dev').classList.remove('on')}
document.querySelectorAll('[data-start]').forEach(card=>card.onclick=()=>start(card.dataset.start));$('next').onclick=nextItem;$('prevSentence').onclick=prevSentence;$('quit').onclick=confirmQuit;$('devToggle').onclick=()=>$('dev').classList.toggle('on');document.addEventListener('keydown',e=>{if($('modal').classList.contains('on'))return;if(e.key==='d'||e.key==='D')$('dev').classList.toggle('on');if(e.key==='ArrowRight'&&$('next').style.display!=='none')nextItem();if(e.key==='ArrowLeft')prevSentence();const buttons=$('choices').querySelectorAll('button');if(/^\d$/.test(e.key)&&buttons[Number(e.key)-1])buttons[Number(e.key)-1].click()});
</script>
