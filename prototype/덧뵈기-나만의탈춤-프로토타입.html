<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>덧뵈기 나만의 탈춤 원전 진행 프로토타입</title>
<style>
:root{--cream:#fff3d2;--gold:#efbd56;--red:#bc3933;--green:#4a9273;--panel:#17151bea;--line:#fff1c536}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0c0b0e;color:var(--cream);font-family:"Malgun Gothic","Noto Sans KR",sans-serif}button{font:inherit}body{display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#3d252b,#0c0b0e 58%)}#app{position:relative;width:min(100vw,177.777vh);height:min(56.25vw,100vh);overflow:hidden;background:#19151a;box-shadow:0 30px 90px #0009;isolation:isolate}.screen{position:absolute;inset:0;display:none}.screen.on{display:flex}
#home{padding:4.5% 5.3%;flex-direction:column;background:radial-gradient(circle at 15% 25%,#75412f55,transparent 26%),radial-gradient(circle at 85% 25%,#3f765855,transparent 26%),linear-gradient(145deg,#332128,#151318 58%)}.kicker{margin:0 0 .5em;color:var(--gold);font-size:clamp(14px,1.1vw,22px);font-weight:900;letter-spacing:.2em}.home-head{display:flex;justify-content:space-between;align-items:flex-end}.home-head h1{margin:0;font-family:Batang,serif;font-size:clamp(42px,4.4vw,84px);letter-spacing:-.06em}.home-head p{width:38%;margin:0;color:#d4c7ad;font-size:clamp(14px,1.05vw,20px);line-height:1.55}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4%;flex:1;min-height:0;margin-top:3%}.card{position:relative;overflow:hidden;padding:0;border:1px solid var(--line);border-radius:24px;color:var(--cream);text-align:left;cursor:pointer;background:linear-gradient(155deg,var(--c1),var(--c2));transition:.2s}.card:hover,.card:focus-visible{transform:translateY(-7px);border-color:var(--gold);outline:0}.mask{position:absolute;left:28%;top:9%;width:44%;aspect-ratio:.88;border-radius:48% 52%;background:var(--mask);box-shadow:inset -18px -12px #0002,0 20px 35px #0005}.mask:before{content:"";position:absolute;left:18%;right:18%;top:38%;height:7%;border-radius:50%;background:#21151c;box-shadow:0 52px 0 -5px #5e1f20}.mask:after{content:"";position:absolute;left:48%;top:18%;width:8%;height:54%;border-radius:50%;background:#7b4b3d88}.card-copy{position:absolute;inset:auto 0 0;padding:18% 8% 7%;background:linear-gradient(transparent,#100e12f2 38%)}.card-copy small{color:var(--gold);font-weight:900;letter-spacing:.13em}.card-copy h2{margin:.18em 0;font-size:clamp(27px,2.4vw,46px);letter-spacing:-.05em}.card-copy p{margin:.3em 0 .8em;color:#d7ccb6;font-size:clamp(13px,.94vw,18px);line-height:1.45}.role{display:inline-block;padding:.4em .7em;border-radius:999px;background:#ffffff14}.role b{color:var(--gold)}
#play{flex-direction:column}.stage{position:absolute;inset:0 0 24%;overflow:hidden;background:linear-gradient(#31363e 0 58%,#7c563a 58% 61%,#302127 61%)}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#08070ba8,transparent 18% 82%,#08070ba8),radial-gradient(ellipse at 50% 78%,#ffc76838,transparent 44%)}.curtain{position:absolute;z-index:4;top:0;width:14%;height:80%;background:linear-gradient(90deg,#4b151d,#982f33 50%,#51161f);filter:drop-shadow(10px 8px 12px #0006)}.curtain.l{left:0;clip-path:polygon(0 0,100% 0,75% 100%,0 91%)}.curtain.r{right:0;transform:scaleX(-1);clip-path:polygon(0 0,100% 0,75% 100%,0 91%)}.top{position:absolute;z-index:20;left:2.4%;right:2.4%;top:2.2%;display:flex;align-items:center;justify-content:space-between}.title{display:flex;align-items:center;gap:1em;font-size:clamp(16px,1.15vw,22px);font-weight:900}.title small{color:var(--gold);letter-spacing:.12em}.source{padding:.5em .8em;border:1px solid var(--line);border-radius:999px;background:#0c0b0e99;color:#d8cdb8;font-size:clamp(11px,.75vw,14px)}.progress{position:absolute;z-index:20;left:2.4%;right:2.4%;top:8%;height:7px;border-radius:10px;background:#ffffff1b}.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .25s}
.cast{position:absolute;inset:0;z-index:7}.actor{--x:50%;--robe:#6d5444;--face:#d6b27c;position:absolute;left:var(--x);top:56%;width:11%;aspect-ratio:.62;transform:translate(-50%,-50%) scale(.9);opacity:.52;transition:.3s}.actor.focus{transform:translate(-50%,-52%) scale(1.08);opacity:1;filter:drop-shadow(0 0 18px #efbd5677)}.actor.move{animation:bob .6s infinite alternate}.body{position:absolute;left:18%;right:18%;top:38%;bottom:0;border-radius:40% 40% 18% 18%;background:var(--robe);box-shadow:inset -12px -8px #0003,0 16px 22px #0005}.head{position:absolute;z-index:2;left:22%;top:5%;width:56%;aspect-ratio:.9;border-radius:48% 52%;background:var(--face);box-shadow:inset -10px -7px #0002,0 8px 14px #0005}.head:before{content:"";position:absolute;left:18%;right:18%;top:39%;height:7%;border-radius:50%;background:#20151c;box-shadow:0 19px 0 -3px #6d2627}.head:after{content:"";position:absolute;left:48%;top:17%;width:8%;height:55%;border-radius:50%;background:#78453877}.name{position:absolute;left:50%;bottom:-10%;transform:translateX(-50%);padding:.25em .65em;border-radius:999px;background:#0e0c10d9;font-weight:900;font-size:clamp(11px,.78vw,15px);white-space:nowrap}.actor[data-role=장쇠]{--robe:#377662}.actor[data-role=꺽쇠]{--robe:#315f8a;--face:#e0af4e}.actor[data-role=옴탈]{--robe:#8b3036;--face:#c84d40}.actor[data-role=샌님]{--robe:#71518a;--face:#e5cfaa}.actor[data-role=말뚝이]{--robe:#326e91;--face:#be4d3b}.actor[data-role=먹중]{--robe:#67502f}.actor[data-role=취발이]{--robe:#9a493c;--face:#d66c3f}.actor[data-role=피조리]{--robe:#a05e80;--face:#ecd0af}.actor[data-role=노친네]{--robe:#68677e}.actor[data-role=잽이]{--robe:#725a37}
.direction-card{position:absolute;z-index:12;left:50%;top:43%;width:min(68%,1200px);transform:translate(-50%,-50%);padding:2.2% 3%;border:1px solid #efbd5666;border-radius:22px;background:#17141be8;box-shadow:0 20px 50px #0008;text-align:center}.direction-card b{display:block;margin-bottom:.55em;color:var(--gold);font-size:clamp(14px,1vw,19px);letter-spacing:.12em}.direction-card p{margin:0;font-family:Batang,serif;font-size:clamp(21px,1.7vw,33px);line-height:1.55}.design-tag{position:absolute;z-index:15;left:50%;top:18%;transform:translateX(-50%);display:none;padding:.5em .85em;border-radius:999px;background:var(--green);font-weight:900;letter-spacing:.08em}.design-tag.on{display:block}.choices{position:absolute;z-index:30;left:4%;right:4%;bottom:25.5%;display:none;justify-content:center;gap:1%}.choices.on{display:flex}.choice{min-width:16%;min-height:70px;padding:.8em 1.2em;border:2px solid #ffffff45;border-radius:17px;color:var(--cream);background:#19161def;cursor:pointer;font-size:clamp(16px,1.12vw,22px);font-weight:900}.choice:hover,.choice:focus-visible{border-color:var(--gold);background:#6d392e;outline:0}.choice.primary{background:#8e302e}
.dialogue{position:absolute;z-index:25;left:0;right:0;bottom:0;height:24%;display:grid;grid-template-columns:15% 1fr auto;gap:2%;align-items:center;padding:1.5% 3.1%;border-top:2px solid #efbd5666;background:var(--panel)}.speaker{color:var(--gold);font-size:clamp(20px,1.55vw,30px);font-weight:900}.speaker.guide{color:#83d5ad}.text{max-height:100%;overflow:auto;padding-right:1%;font-size:clamp(19px,1.55vw,30px);font-weight:700;line-height:1.48;letter-spacing:-.025em;scrollbar-width:thin}.next{min-width:110px;padding:.85em;border:1px solid var(--line);border-radius:14px;color:var(--cream);background:#ffffff12;cursor:pointer;font-weight:900}.next:hover{border-color:var(--gold)}.tools{position:absolute;z-index:35;left:2.2%;top:12%;display:flex;flex-direction:column;gap:8px}.tool{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;color:var(--cream);background:#0b0a0dbb;cursor:pointer;font-weight:900}.tool:hover{background:#80332f}.autobar{position:absolute;z-index:35;right:2.3%;top:12%;display:flex;align-items:center;gap:.55em;padding:.45em .65em;border-radius:12px;background:#0b0a0dbb;color:#d8cebb;font-size:clamp(11px,.72vw,14px)}.autobar button{border:0;border-radius:8px;padding:.35em .6em;color:var(--cream);background:#ffffff16;cursor:pointer}.autobar select{color:var(--cream);background:#211d24;border:1px solid var(--line);border-radius:6px;padding:.25em}.toast{position:absolute;z-index:40;left:50%;top:40%;transform:translate(-50%,-50%) scale(.8);opacity:0;padding:.45em .8em;border-radius:16px;background:#111015eb;color:var(--gold);font-family:Batang,serif;font-size:clamp(34px,4vw,76px);font-weight:900;pointer-events:none}.toast.on{animation:toast 1s ease}@keyframes bob{to{margin-top:-16px}}@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}20%,72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}@media(max-width:1050px),(max-height:620px){.choice{min-height:48px}.dialogue{grid-template-columns:14% 1fr auto}.next{min-width:82px}}
</style></head><body><main id="app">
<section id="home" class="screen on"><div class="home-head"><div><p class="kicker">원전 대사 전수 진행</p><h1>덧뵈기, 나만의 탈춤</h1></div><p>마당 하나를 고르면 원전의 모든 대사와 지문을 행 순서대로 진행합니다. 설계 입력은 원전과 분리해 표시합니다.</p></div><div class="cards">
<button class="card" data-scene="omtal" style="--c1:#79362e;--c2:#24191f;--mask:#c94d40"><span class="mask"></span><span class="card-copy"><small>둘째 마당</small><h2>옴탈잡이</h2><p>원전 420~466행을 처음부터 끝까지 확인합니다.</p><span class="role">유저 배역 <b>꺽쇠</b></span></span></button>
<button class="card" data-scene="saennim" style="--c1:#5d4777;--c2:#221d28;--mask:#e5cfaa"><span class="mask"></span><span class="card-copy"><small>셋째 마당</small><h2>샌님잡이</h2><p>원전 470~626행을 처음부터 끝까지 확인합니다.</p><span class="role">유저 배역 <b>말뚝이</b></span></span></button>
<button class="card" data-scene="meokjung" style="--c1:#496345;--c2:#1d1c20;--mask:#d1b379"><span class="mask"></span><span class="card-copy"><small>넷째 마당</small><h2>먹중잡이</h2><p>원전 630~704행을 처음부터 끝까지 확인합니다.</p><span class="role">유저 배역 <b>취발이</b></span></span></button></div></section>
<section id="play" class="screen"><div class="stage"><div class="curtain l"></div><div class="curtain r"></div><div id="cast" class="cast"></div><div id="direction" class="direction-card"><b>원전 지문</b><p></p></div><div id="designTag" class="design-tag">설계 입력</div></div><header class="top"><div class="title"><small id="yard"></small><span id="sceneTitle"></span></div><div id="source" class="source"></div></header><div class="progress"><i id="bar"></i></div><div id="choices" class="choices"></div><div id="toast" class="toast"></div><div class="dialogue"><div id="speaker" class="speaker"></div><div id="text" class="text"></div><button id="next" class="next">다음 ▶</button></div><div class="tools"><button id="homeBtn" class="tool" title="마당 선택">⌂</button><button id="prev" class="tool" title="이전">‹</button></div><div class="autobar"><button id="auto">자동 재생</button><label>간격 <select id="speed"><option value="3000">3초</option><option value="5000" selected>5초</option><option value="8000">8초</option></select></label></div></section></main>
<script src="덧뵈기-원전대사.js"></script><script>
const D=window.DEOTBOEGI_SCRIPT;const sceneMeta={omtal:{yard:'둘째 마당',cast:['장쇠','꺽쇠','옴탈'],prompts:{428:{text:'옴탈이 다가옵니다. 반대 방향으로 피하세요.',choices:[['왼쪽으로 피하기','ok'],['오른쪽으로 피하기','ok']]},458:{text:'옴탈이 대듭니다. 거리를 벌려 피하세요.',choices:[['몸을 옮겨 피하기','ok']]},464:{text:'꺽쇠의 마지막 대들기입니다. 밀어내는 동작을 하세요.',choices:[['앞으로 밀어내기','ok']]}}},saennim:{yard:'셋째 마당',cast:['장쇠','샌님','노친네','잽이','말뚝이','피조리','피조리'],prompts:{542:{text:'방금 재담에서 말뚝이가 받아칠 표현을 고르세요.',choices:[['절의 뜻을 바꿔 말하기','ok'],['그냥 절하기','retry']]},558:{text:'샌님의 말에서 ‘전부 따라 하라’는 뜻을 가장 직접적으로 강조한 구절을 고르세요.',choices:[['한 가지도 빼놓지 말고','ok'],['시키는 대로','retry']]}}},meokjung:{yard:'넷째 마당',cast:['장쇠','먹중','피조리','피조리','취발이','잽이'],prompts:{630:{text:'피조리와 함께 멈칫했지만 부채로 얼굴을 다시 가린 인물을 지목하세요. 부채 동작은 설계에서 추가한 구별 동작입니다.',choices:[['먹중','ok'],['피조리','retry'],['지목하지 않음','skip']]},634:{text:'모두 눈치를 보지만 취발이와 피조리 사이를 거듭 살핀 인물을 지목하세요. 고개 동작은 설계에서 추가한 구별 동작입니다.',choices:[['먹중','ok'],['피조리','retry'],['지목하지 않음','skip']]}}}};
const $=id=>document.getElementById(id);let key=null,timeline=[],index=0,autoTimer=null,autoOn=false,locked=false;const actorStyle={장쇠:12,꺽쇠:37,옴탈:66,샌님:43,노친네:25,잽이:78,말뚝이:68,먹중:42,피조리:62,취발이:24};
function clean(s){return s.trim()}function build(k){const sc=D.scenes[k],p=sceneMeta[k].prompts;timeline=[];sc.entries.forEach((e,n)=>{timeline.push({...e,sourceIndex:n+1,total:sc.entries.length});if(p[e.line])timeline.push({type:'design',speaker:'안내',line:e.line,text:p[e.line].text,choices:p[e.line].choices,sourceIndex:n+1,total:sc.entries.length})})}
function visibleCast(entry){let names=[...sceneMeta[key].cast],line=entry.line;if(key==='omtal'&&line<424)names=names.filter(n=>n!=='옴탈');if(key==='saennim'){if(line<528)names=names.filter(n=>n!=='말뚝이');if(line<622)names=names.filter(n=>n!=='피조리')}if(key==='meokjung'){if(line<632)names=names.filter(n=>n!=='취발이');if(line<638)names=names.filter(n=>n!=='잽이');if(line>672)names=names.filter(n=>n!=='먹중')}return names}
function actors(entry){const names=visibleCast(entry);return names.map((name,i)=>{const occurrence=names.slice(0,i).filter(x=>x===name).length;let x=actorStyle[name]??50;if(name==='피조리')x=62+occurrence*16;const f=name===entry.speaker?' focus move':'';return `<div class="actor${f}" data-role="${name}" style="--x:${x}%"><span class="head"></span><span class="body"></span><span class="name">${name}${name==='피조리'?' '+(occurrence+1):''}</span></div>`}).join('')}
function render(){clearTimeout(autoTimer);const e=timeline[index],sc=D.scenes[key],isDir=e.type==='direction',isDesign=e.type==='design';$('yard').textContent=sceneMeta[key].yard;$('sceneTitle').textContent=sc.title;$('source').textContent=isDesign?`설계 입력, 원전 ${e.line}행 뒤`:`원전 ${e.line}행, ${e.sourceIndex}/${e.total}`;$('bar').style.width=`${((index+1)/timeline.length)*100}%`;$('cast').innerHTML=actors(e);$('direction').style.display=isDir?'block':'none';$('direction').querySelector('p').textContent=isDir?clean(e.text):'';$('designTag').classList.toggle('on',isDesign);$('speaker').textContent=isDir?'지문':e.speaker;$('speaker').classList.toggle('guide',isDesign);$('text').textContent=isDir?'무대 지문을 화면 중앙에서 확인하세요.':clean(e.text);$('choices').innerHTML='';$('choices').classList.toggle('on',isDesign);$('next').hidden=isDesign;if(isDesign)e.choices.forEach(([label,result],n)=>{const b=document.createElement('button');b.className='choice '+(result==='ok'?'primary':'');b.textContent=`${n+1}. ${label}`;b.onclick=()=>choose(result);$('choices').appendChild(b)});locked=false;if(autoOn&&!isDesign)schedule()}
function choose(result){if(locked)return;if(result==='retry'){flash('다시 살펴보세요');return}locked=true;flash(result==='skip'?'원전 진행 유지':'입력 확인');setTimeout(advance,700)}function flash(s){const t=$('toast');t.textContent=s;t.classList.remove('on');void t.offsetWidth;t.classList.add('on')}function advance(){if(index<timeline.length-1){index++;render()}else{stopAuto();showHome()}}function schedule(){autoTimer=setTimeout(advance,Number($('speed').value))}function stopAuto(){autoOn=false;clearTimeout(autoTimer);$('auto').textContent='자동 재생'}function start(k){key=k;index=0;build(k);$('home').classList.remove('on');$('play').classList.add('on');render()}function showHome(){stopAuto();key=null;$('play').classList.remove('on');$('home').classList.add('on')}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>start(b.dataset.scene));$('next').onclick=advance;$('homeBtn').onclick=showHome;$('prev').onclick=()=>{if(!locked&&index>0){index--;render()}};$('auto').onclick=()=>{autoOn=!autoOn;$('auto').textContent=autoOn?'일시 정지':'자동 재생';clearTimeout(autoTimer);if(autoOn&&timeline[index].type!=='design')schedule()};$('speed').onchange=()=>{if(autoOn){clearTimeout(autoTimer);schedule()}};document.addEventListener('keydown',e=>{if(e.key==='Escape')showHome();if(!key)return;if(e.key==='ArrowRight'&&!$('next').hidden)advance();if(e.key==='ArrowLeft'&&!locked&&index>0){index--;render()}if(/^\d$/.test(e.key)){const b=$('choices').querySelectorAll('button')[Number(e.key)-1];if(b)b.click()}});
</script></body></html>
