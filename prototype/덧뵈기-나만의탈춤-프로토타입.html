<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>덧뵈기, 나만의 탈춤 프로토타입</title>
  <style>
    :root{color-scheme:dark;--cream:#fff3d3;--gold:#efb94e;--red:#bd3d37;--green:#4a9a76;--blue:#4b78a7;--panel:#17151bf2;--line:#fff1ca38}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b0a0d;color:var(--cream);font-family:"Malgun Gothic","Noto Sans KR",sans-serif}button{font:inherit}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% 8%,#492b31,#0b0a0d 60%)}
    #app{position:relative;width:min(100vw,177.777vh);height:min(56.25vw,100vh);overflow:hidden;background:#18151a;box-shadow:0 25px 80px #000a;isolation:isolate}.screen{position:absolute;inset:0;display:none}.screen.on{display:flex}
    #home{padding:4.4% 5.2%;flex-direction:column;background:radial-gradient(circle at 17% 25%,#81482e55,transparent 28%),radial-gradient(circle at 84% 28%,#3f795755,transparent 28%),linear-gradient(145deg,#36232a,#151318 59%)}
    .home-head{display:flex;justify-content:space-between;align-items:flex-end}.kicker{margin:0 0 .5em;color:var(--gold);font-size:clamp(14px,1.1vw,22px);font-weight:900;letter-spacing:.18em}.home-head h1{margin:0;font-family:Batang,serif;font-size:clamp(42px,4.3vw,82px);letter-spacing:-.06em}.home-head>p{width:39%;margin:0;color:#d6c9af;font-size:clamp(14px,1.05vw,20px);line-height:1.55}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4%;flex:1;min-height:0;margin-top:3%}.card{position:relative;overflow:hidden;padding:0;border:1px solid var(--line);border-radius:24px;color:var(--cream);text-align:left;background:linear-gradient(155deg,var(--c1),var(--c2));cursor:pointer;transition:.2s}.card:not(:disabled):hover,.card:not(:disabled):focus-visible{transform:translateY(-7px);border-color:var(--gold);outline:0}.card:disabled{cursor:not-allowed;filter:grayscale(.7);opacity:.52}.mask{position:absolute;left:29%;top:8%;width:42%;aspect-ratio:.9;border-radius:47% 53%;background:var(--mask);box-shadow:inset -16px -11px #0003,0 18px 35px #0006}.mask:before{content:"";position:absolute;left:18%;right:18%;top:39%;height:7%;border-radius:50%;background:#20151c;box-shadow:0 48px 0 -5px #642226}.mask:after{content:"";position:absolute;left:48%;top:17%;width:8%;height:55%;border-radius:50%;background:#7e4a3d77}.card-copy{position:absolute;inset:auto 0 0;padding:18% 8% 7%;background:linear-gradient(transparent,#0e0d10f4 38%)}.card-copy small{color:var(--gold);font-weight:900;letter-spacing:.12em}.card-copy h2{margin:.18em 0;font-size:clamp(27px,2.35vw,45px);letter-spacing:-.05em}.card-copy p{margin:.3em 0 .8em;color:#d7cdb8;font-size:clamp(13px,.93vw,18px);line-height:1.45}.chip{display:inline-block;padding:.4em .7em;border-radius:999px;background:#ffffff14}.chip b{color:var(--gold)}
    #play{flex-direction:column}.topbar{position:absolute;z-index:30;left:2.4%;right:2.4%;top:2.3%;height:6%;display:flex;align-items:center;justify-content:space-between}.scene-title{display:flex;gap:.9em;align-items:center;font-size:clamp(17px,1.2vw,23px);font-weight:900}.scene-title small{color:var(--gold);letter-spacing:.12em}.quit{padding:.55em .85em;border:1px solid var(--line);border-radius:11px;color:var(--cream);background:#111015aa;cursor:pointer;font-weight:800}.quit:hover{border-color:var(--gold)}
    .stage{position:absolute;inset:0 0 25%;overflow:hidden;background:linear-gradient(#303841 0 57%,#8a603e 57% 60%,#302227 60%)}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#08070ba8,transparent 17% 83%,#08070ba8),radial-gradient(ellipse at 50% 78%,#ffd2743c,transparent 45%)}.curtain{position:absolute;z-index:5;top:0;width:14%;height:78%;background:linear-gradient(90deg,#4b151d,#9a3034 50%,#51161f);filter:drop-shadow(10px 8px 12px #0007)}.curtain.left{left:0;clip-path:polygon(0 0,100% 0,75% 100%,0 91%)}.curtain.right{right:0;transform:scaleX(-1);clip-path:polygon(0 0,100% 0,75% 100%,0 91%)}.floor-mark{position:absolute;z-index:3;left:50%;bottom:8%;width:22%;height:10%;transform:translateX(-50%);border:3px dashed #efb94e77;border-radius:50%;opacity:0}.floor-mark.on{opacity:1;animation:pulse 1s infinite alternate}
    .cast{position:absolute;inset:0;z-index:9}.actor{--x:50%;--y:57%;--scale:1;--robe:#6c5141;--face:#d7b078;position:absolute;left:var(--x);top:var(--y);width:12%;aspect-ratio:.62;transform:translate(-50%,-50%) scale(var(--scale));opacity:0;transition:left .42s,top .42s,transform .35s,opacity .25s,filter .25s}.actor.show{opacity:1}.actor.back{--scale:.77;opacity:.64}.actor.focus{--scale:1.08;filter:drop-shadow(0 0 18px #efb94e88)}.actor.hit{animation:shake .2s 4}.actor.dance{animation:bob .55s infinite alternate}.head{position:absolute;z-index:2;left:22%;top:4%;width:56%;aspect-ratio:.9;border-radius:48% 52%;background:var(--face);box-shadow:inset -10px -8px #0002,0 9px 15px #0006}.head:before{content:"";position:absolute;left:18%;right:18%;top:39%;height:7%;border-radius:50%;background:#20151c;box-shadow:0 20px 0 -3px #6a2527}.head:after{content:"";position:absolute;left:48%;top:16%;width:8%;height:56%;border-radius:50%;background:#75443677}.body{position:absolute;left:18%;right:18%;top:38%;bottom:0;border-radius:40% 40% 18% 18%;background:var(--robe);box-shadow:inset -14px -9px #0003,0 16px 22px #0005}.arm{position:absolute;z-index:-1;top:43%;width:22%;height:43%;border-radius:999px;background:var(--robe);transform-origin:50% 10%}.arm.a{left:5%;transform:rotate(18deg)}.arm.b{right:5%;transform:rotate(-18deg)}.actor.push .arm.a{transform:rotate(-58deg)}.actor.push .arm.b{transform:rotate(58deg)}.name{position:absolute;left:50%;bottom:-10%;transform:translateX(-50%);padding:.28em .65em;border-radius:999px;background:#0d0c10da;font-size:clamp(11px,.78vw,15px);font-weight:900;white-space:nowrap}.actor[data-role=장쇠]{--robe:#397865}.actor[data-role=꺽쇠]{--robe:#32638e;--face:#e1ad49}.actor[data-role=옴탈]{--robe:#8d3037;--face:#c84b3e}
    .action-cue{position:absolute;z-index:16;left:50%;top:36%;transform:translate(-50%,-50%);display:none;text-align:center;pointer-events:none}.action-cue.on{display:block}.action-cue strong{display:block;font-family:Batang,serif;font-size:clamp(42px,5vw,96px);text-shadow:0 8px 25px #0009}.action-cue span{display:inline-block;margin-top:.7em;padding:.45em .8em;border-radius:999px;background:#111015dd;color:var(--gold);font-weight:900}.arrow{font-size:1.3em;color:var(--gold)}
    .choices{position:absolute;z-index:35;left:4%;right:4%;bottom:26.5%;display:none;justify-content:center;gap:1%}.choices.on{display:flex}.choice{min-width:15%;min-height:68px;padding:.8em 1.2em;border:2px solid #ffffff45;border-radius:17px;color:var(--cream);background:#19161def;cursor:pointer;font-size:clamp(15px,1.05vw,21px);font-weight:900}.choice:hover,.choice:focus-visible{border-color:var(--gold);background:#68352d;outline:0}.choice.primary{background:#8d302e}.choice.safe{background:#356f5c}
    .dialogue{position:absolute;z-index:28;left:0;right:0;bottom:0;height:25%;display:grid;grid-template-columns:15% 1fr auto;gap:2%;align-items:center;padding:1.45% 3.1%;border-top:2px solid #efb94e66;background:var(--panel)}.speaker-wrap{align-self:center}.kind{display:inline-block;margin-bottom:.45em;padding:.28em .55em;border-radius:999px;background:#ffffff12;color:#d7cbb4;font-size:clamp(10px,.7vw,13px);font-weight:900}.speaker{color:var(--gold);font-size:clamp(19px,1.5vw,29px);font-weight:900}.speaker.guide{color:#84d7b0}.text{max-height:100%;overflow:auto;padding-right:1%;font-size:clamp(19px,1.52vw,30px);font-weight:700;line-height:1.48;letter-spacing:-.025em;scrollbar-width:thin}.controls{display:flex;gap:.5em;align-items:center}.next,.sentence{padding:.8em .9em;border:1px solid var(--line);border-radius:12px;color:var(--cream);background:#ffffff12;cursor:pointer;font-weight:900}.next:hover,.sentence:hover{border-color:var(--gold)}.sentence{display:none}.sentence.on{display:block}
    .dev{position:absolute;z-index:50;top:10%;right:2.3%;display:none;width:23%;padding:1%;border:1px solid var(--line);border-radius:14px;background:#0e0d11e8;font-size:clamp(10px,.72vw,14px);line-height:1.55}.dev.on{display:block}.dev b{color:var(--gold)}.dev-toggle{position:absolute;z-index:51;right:2.3%;top:10%;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;color:var(--cream);background:#0d0c10cc;cursor:pointer}.dev.on+.dev-toggle{right:26%}.modal{position:absolute;z-index:80;inset:0;display:none;place-items:center;background:#08070bc9}.modal.on{display:grid}.modal-box{width:min(52%,850px);padding:3%;border:1px solid var(--line);border-radius:22px;background:#1a171e;text-align:center;box-shadow:0 20px 60px #0009}.modal-box h2{margin:0 0 .6em;font-size:clamp(28px,2.4vw,46px)}.modal-box p{color:#d8cdb8;font-size:clamp(15px,1.1vw,21px);line-height:1.55}.modal-actions{display:flex;justify-content:center;gap:1em;margin-top:1.5em}.modal-actions button{padding:.8em 1.2em;border:1px solid var(--line);border-radius:12px;color:var(--cream);background:#ffffff12;cursor:pointer}.modal-actions .primary{background:#8d302e}
    @keyframes bob{to{margin-top:-14px}}@keyframes shake{25%{margin-left:-12px}75%{margin-left:12px}}@keyframes pulse{to{transform:translateX(-50%) scale(1.08);opacity:1}}
    @media(max-width:1050px),(max-height:620px){.choice{min-height:48px}.dialogue{grid-template-columns:14% 1fr auto}.next,.sentence{padding:.6em}.dev{width:29%}.dev.on+.dev-toggle{right:32%}}
  </style>
</head>
<body>
<main id="app">
  <section id="home" class="screen on">
    <div class="home-head"><div><p class="kicker">원전 재담과 몸동작 체험</p><h1>덧뵈기, 나만의 탈춤</h1></div><p>마당 하나를 골라 원전 대사와 지문을 모두 따라가며 플레이 입력의 흐름을 확인합니다.</p></div>
    <div class="cards">
      <button class="card" data-start="omtal" style="--c1:#7b362f;--c2:#24191f;--mask:#c94c3e"><span class="mask"></span><span class="card-copy"><small>구현됨</small><h2>옴탈잡이</h2><p>재담 사이에 좌우 회피와 밀어내기를 체험합니다.</p><span class="chip">유저 배역 <b>꺽쇠</b></span></span></button>
      <button class="card" disabled style="--c1:#5e4877;--c2:#221d28;--mask:#e4ceaa"><span class="mask"></span><span class="card-copy"><small>다음 게이트</small><h2>샌님잡이</h2><p>옴탈잡이 확인 뒤 구현합니다.</p><span class="chip">유저 배역 <b>말뚝이</b></span></span></button>
      <button class="card" disabled style="--c1:#486444;--c2:#1d1c20;--mask:#d1b178"><span class="mask"></span><span class="card-copy"><small>구현 대기</small><h2>먹중잡이</h2><p>샌님잡이 확인 뒤 구현합니다.</p><span class="chip">유저 배역 <b>취발이</b></span></span></button>
    </div>
  </section>
  <section id="play" class="screen">
    <div class="stage"><div class="curtain left"></div><div class="curtain right"></div><div id="floorMark" class="floor-mark"></div><div id="cast" class="cast"></div><div id="cue" class="action-cue"><strong></strong><span></span></div></div>
    <header class="topbar"><div class="scene-title"><small>둘째 마당</small><span>옴탈잡이</span></div><button id="quit" class="quit">그만두기</button></header>
    <div id="choices" class="choices"></div>
    <div class="dialogue"><div class="speaker-wrap"><div id="kind" class="kind"></div><div id="speaker" class="speaker"></div></div><div id="text" class="text"></div><div class="controls"><button id="prevSentence" class="sentence">이전 문장</button><button id="next" class="next">다음 ▶</button></div></div>
    <aside id="dev" class="dev"><b>개발자 시험 정보</b><div id="devText"></div></aside><button id="devToggle" class="dev-toggle" title="개발자 정보">D</button>
  </section>
  <div id="modal" class="modal"><div class="modal-box"><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalActions" class="modal-actions"></div></div></div>
</main>
<script src="덧뵈기-원전대사.js"></script><script src="덧뵈기-진행상태.js"></script><script src="덧뵈기-표시도구.js"></script>
<script>
const $=id=>document.getElementById(id);const source=DEOTBOEGI_SOURCE.scenes.omtal;const stateSet=DEOTBOEGI_STATES.scenes.omtal;const states=new Map(stateSet.states.map(s=>[s.id,s]));const rowMap=new Map(source.rows.map(r=>[r.sourceLine,r]));
let stateId='omtal-01',queue=[],queueIndex=0,pageIndex=0,shownLines=new Set(),ctx={recognitionFails:0,pushRecognitionFails:0,firstPushFails:0,finalFails:0,cycle:0,retry:0,successes:0,failures:0,finalFailure:false};
const actorsByState={
 'omtal-01':['장쇠','꺽쇠'],'omtal-02':['장쇠','꺽쇠'],'omtal-03':['장쇠','꺽쇠','옴탈'],'omtal-04':['장쇠','꺽쇠','옴탈'],'omtal-05':['장쇠','꺽쇠','옴탈'],'omtal-06':['장쇠','꺽쇠','옴탈'],'omtal-07':['장쇠','꺽쇠','옴탈'],'omtal-08':['장쇠','꺽쇠','옴탈'],'omtal-09':['장쇠','꺽쇠','옴탈'],'omtal-10':['장쇠','꺽쇠','옴탈'],'omtal-11':['장쇠','꺽쇠','옴탈'],'omtal-12':['장쇠','꺽쇠','옴탈'],'omtal-13':['장쇠','꺽쇠','옴탈'],'omtal-14':['장쇠','꺽쇠','옴탈'],'omtal-15':['장쇠','꺽쇠','옴탈'],'omtal-16':['장쇠','꺽쇠']};
function design(text,speaker='안내'){return {kind:'설계',speaker,text,pages:[text]}}function sourceItems(lines){const items=[];for(const line of lines){if(shownLines.has(line))continue;shownLines.add(line);const row=rowMap.get(line);if(!row)continue;for(const segment of row.segments){const pages=DEOTBOEGI_DISPLAY.paginateSourceText(segment.text);items.push({kind:segment.type==='direction'?'원전 지문':'원전 대사',speaker:segment.speaker,text:segment.text,pages,sourceLine:line})}}return items}function input(prompt,options,cue=''){return {kind:'행동 안내',speaker:'안내',text:prompt,pages:[prompt],options,cue}}
function parseDesignText(raw){
 if(!raw||raw==='없음')return[];
 const marked=[...raw.matchAll(/`\[([^\]]+)\]\s*([^`]+)`/g)];
 if(marked.length)return marked.map(([,speaker,text])=>design(text.trim(),speaker));
 return[design(raw.replace(/`/g,'').trim(),'안내')]
}
function stateSourceLines(id){return source.rows.filter(r=>r.stateIds.includes(id)).map(r=>r.sourceLine)}
function standardQueue(id){const state=states.get(id),lines=stateSourceLines(id);let items=[];if(['omtal-05','omtal-11','omtal-14','omtal-15'].includes(id))items.push(...sourceItems(lines),...parseDesignText(state.bottomText));else items.push(...parseDesignText(state.bottomText),...sourceItems(lines));return items}
function enter(id,options={}){stateId=id;queueIndex=0;pageIndex=0;queue=[];updateStage();if(id==='omtal-07'&&!options.resume){ctx.cycle=0;ctx.retry=0;startCycle();return}if(id==='omtal-09'){buildRetry();return}if(id==='omtal-08'){const successMore=ctx.successes>ctx.failures;queue=[design(successMore?'쫓아오는 재주는 있어도 잡는 재주는 없구나.':'제법 피하지만 아직 멀었다.',successMore?'꺽쇠':'옴탈')]}else queue=standardQueue(id);appendStateInput(id);if(!queue.length)queue=[design('다음 장면으로 진행합니다.','장쇠')];render()}
function appendStateInput(id){if(id==='omtal-01')queue.push(input('마당 전경을 확인했으면 체험을 시작하세요.',[['체험 시작',()=>enter('omtal-02')]]));if(id==='omtal-02')queue.push(input('화면 가운데에서 좌우로 가볍게 움직이세요.',[['인식됨',()=>enter('omtal-03'),'primary'],['인식되지 않음',recognitionFail],['무입력',recognitionFail]],'좌우로 움직이기'));if(id==='omtal-03')queue.push(input('옴탈이 시작 위치에 도착했습니다.',[['첫 접근 보기',()=>enter('omtal-04')]]));if(id==='omtal-04')queue.push(input('옴탈이 왼쪽에서 옵니다. 반대쪽으로 피하세요.',[['왼쪽으로 이동',()=>enter('omtal-06')],['오른쪽으로 이동',()=>enter('omtal-05'),'primary'],['무입력',()=>enter('omtal-06')]],'옴탈 반대쪽으로 피하기'));if(id==='omtal-05')queue.push(input('첫 회피가 끝났습니다.',[['연속 회피 시작',()=>enter('omtal-07')]]));if(id==='omtal-06')queue.push(input(ctx.retry?'속도를 낮추고 영역을 완화했습니다. 다시 피하세요.':'같은 접근을 다시 피하세요.',[['반대쪽으로 피하기',()=>enter('omtal-05'),'primary'],['다시 놓치기',firstEvadeRetry],['무입력',firstEvadeRetry]]));if(id==='omtal-08')queue.push(input('연속 회피 결과를 확인했습니다.',[['퇴치 동작 배우기',()=>enter('omtal-10')]]));if(id==='omtal-10')queue.push(input('두 팔을 앞으로 뻗은 뒤 중립 자세로 돌아오세요.',[['동작과 중립 자세 인식',()=>enter('omtal-11'),'primary'],['인식되지 않음',pushRecognitionFail],['무입력',pushRecognitionFail]],'두 팔 밀어내기 연습'));if(id==='omtal-11')queue.push(input('옴탈이 멈춰 버티는 순간 밀어내세요.',[['정지 뒤 밀어내기',()=>enter('omtal-12'),'primary'],['너무 이르거나 늦음',()=>enter('omtal-13')],['무입력',()=>enter('omtal-13')]],'멈춤 뒤 밀어내기'));if(id==='omtal-12')queue.push(input('옴탈이 다시 일어났습니다.',[['마지막 공방',()=>enter('omtal-14')]]));if(id==='omtal-13')queue.push(input(ctx.firstPushFails>=1?'판정 영역과 허용 시간을 완화했습니다. 멈춘 뒤 다시 밀어내세요.':'옴탈이 멈추는 순간을 다시 보세요.',[['정지 뒤 밀어내기',()=>enter('omtal-12'),'primary'],['다시 놓치기',firstPushRetry],['무입력',firstPushRetry]]));if(id==='omtal-14')queue.push(input(ctx.finalFails?'판정을 완화했습니다. 실제 방향의 반대로 피한 뒤 멈추면 밀어내세요.':'가짜 방향에 속지 말고 실제 방향의 반대로 피한 뒤, 멈추면 밀어내세요.',[['회피 뒤 밀어내기',()=>enter('omtal-15'),'primary'],['회피 또는 밀어내기 실패',finalRetry],['무입력',finalRetry]],'가짜 방향 → 회피 → 밀어내기'));if(id==='omtal-15')queue.push(input('옴탈이 퇴장했습니다.',[['마당 마무리',()=>enter('omtal-16')]]));if(id==='omtal-16')queue.push(input(ctx.finalFailure?'완화한 마지막 공방도 실패했지만 마당은 끝까지 진행했습니다.':'옴탈잡이 한마당을 마쳤습니다.',[['마당 선택으로',goHome,'safe']]));}
function recognitionFail(){ctx.recognitionFails++;if(ctx.recognitionFails>=2)return recovery('위치와 동작을 다시 확인했지만 인식되지 않았습니다.');queue=[design('거리와 위치를 다시 안내합니다. 화면 중앙에 서세요.','장쇠'),input('한 차례 다시 확인합니다.',[['인식됨',()=>enter('omtal-03'),'primary'],['다시 인식되지 않음',recognitionFail]])];queueIndex=0;render()}
function firstEvadeRetry(){ctx.retry++;if(ctx.retry>=2){ctx.retry=0;queue=[design('장쇠가 피하는 동작을 시범으로 보여줍니다. 연속 회피로 넘어갑니다.','장쇠'),input('시범을 확인했습니다.',[['연속 회피',()=>enter('omtal-07')]])]}else{enter('omtal-06');return}queueIndex=0;render()}
function startCycle(){if(ctx.cycle>=stateSet.sourceSchedule.blocks.length)return enter('omtal-08');stateId='omtal-07';updateStage();const block=stateSet.sourceSchedule.blocks[ctx.cycle];const direction=ctx.cycle%2===0?'왼쪽':'오른쪽';const correct=direction==='왼쪽'?'오른쪽':'왼쪽';queue=[...sourceItems(block),input(`새로운 접근 ${ctx.cycle+1}/9: 옴탈이 ${direction}에서 옵니다. 반대쪽으로 피하세요.`,[[`${correct}으로 피하기`,cycleSuccess,'primary'],[`${direction}으로 이동`,()=>{ctx.retry=0;enter('omtal-09')}],['무입력',()=>{ctx.retry=0;enter('omtal-09')}]],`${direction==='왼쪽'?'←':'→'} 접근, 반대쪽 회피`)];queueIndex=0;pageIndex=0;render()}
function cycleSuccess(){ctx.successes++;ctx.cycle++;startCycle()}function buildRetry(){const direction=ctx.cycle%2===0?'왼쪽':'오른쪽',correct=direction==='왼쪽'?'오른쪽':'왼쪽';const fail=()=>{ctx.retry++;if(ctx.retry>=2){ctx.failures++;ctx.cycle++;ctx.retry=0;startCycle()}else buildRetry()};queue=[...parseDesignText(states.get('omtal-09').bottomText),input(ctx.retry?'접근 속도를 낮췄습니다. 같은 접근을 한 번 더 피하세요.':'같은 접근이 다시 옵니다. 반대쪽으로 피하세요.',[[`${correct}으로 피하기`,()=>{ctx.successes++;ctx.cycle++;ctx.retry=0;startCycle()},'primary'],['다시 놓치기',fail],['무입력',fail]],ctx.retry?'완화된 접근':'같은 접근 재시도')];queueIndex=0;render()}
function pushRecognitionFail(){ctx.pushRecognitionFails++;if(ctx.pushRecognitionFails>=2)return recovery('손과 팔 위치를 다시 확인했지만 인식되지 않았습니다.');queue=[design('손과 팔의 위치를 다시 안내합니다.','장쇠'),input('한 차례 다시 확인합니다.',[['동작과 중립 자세 인식',()=>enter('omtal-11'),'primary'],['다시 인식되지 않음',pushRecognitionFail]])];queueIndex=0;render()}
function firstPushRetry(){ctx.firstPushFails++;if(ctx.firstPushFails>=2){queue=[design('장쇠가 밀어내기 시범을 보여준 뒤 마지막 공방으로 진행합니다.','장쇠'),input('시범을 확인했습니다.',[['마지막 공방',()=>enter('omtal-14')]])];queueIndex=0;render()}else enter('omtal-13')}
function finalRetry(){ctx.finalFails++;if(ctx.finalFails>=2){ctx.finalFailure=true;queue=[design('완화한 입력도 실패했습니다. 옴탈이 비틀거리며 물러나는 실패 결말을 재생합니다.','장쇠'),input('실패 결말 확인',[["마당 마무리",()=>enter('omtal-16')]])];queueIndex=0;render()}else enter('omtal-14')}
function nextItem(){const item=queue[queueIndex];if(item&&pageIndex<item.pages.length-1){pageIndex++;render();return}if(queueIndex<queue.length-1){queueIndex++;pageIndex=0;render();return}const automatic={'omtal-03':'omtal-04','omtal-08':'omtal-10'}[stateId];if(automatic)enter(automatic)}
function prevSentence(){if(pageIndex>0){pageIndex--;render()}else if(queueIndex>0){queueIndex--;pageIndex=queue[queueIndex].pages.length-1;render()}}
function render(){const item=queue[queueIndex]||design('진행 정보를 준비하고 있습니다.');$('kind').textContent=item.kind;$('speaker').textContent=item.speaker;$('speaker').classList.toggle('guide',item.speaker==='안내');$('text').textContent=item.pages[pageIndex]??item.text;$('choices').innerHTML='';$('choices').classList.toggle('on',!!item.options);if(item.options)item.options.forEach(([label,action,cls])=>{const b=document.createElement('button');b.className=`choice ${cls||''}`;b.textContent=label;b.onclick=action;$('choices').appendChild(b)});$('next').style.display=item.options?'none':'block';$('prevSentence').classList.toggle('on',pageIndex>0||queueIndex>0);$('prevSentence').textContent=pageIndex>0?'이전 문장':'이전 항목';$('cue').classList.toggle('on',!!item.cue);$('cue').querySelector('strong').textContent=item.cue?.split(' ')[0]||'';$('cue').querySelector('span').textContent=item.cue||'';updateDev(item);}
function updateStage(){const names=actorsByState[stateId]||[];const stateNo=Number(stateId.split('-')[1]);const positions={장쇠:18,꺽쇠:50,옴탈:78};$('cast').innerHTML=names.map(name=>{let cls='actor show';if(name==='장쇠'&&stateNo>=4&&!['10','15','16'].includes(stateId.split('-')[1]))cls+=' back';if((stateId==='omtal-07'||stateId==='omtal-09')&&name==='옴탈')cls+=' dance';if(['omtal-10','omtal-11','omtal-13','omtal-14','omtal-15'].includes(stateId)&&name==='꺽쇠')cls+=' push';if(['omtal-05','omtal-12','omtal-15'].includes(stateId)&&name==='옴탈')cls+=' hit';return `<div class="${cls}" data-role="${name}" style="--x:${positions[name]}%"><span class="head"></span><span class="body"><i class="arm a"></i><i class="arm b"></i></span><span class="name">${name}</span></div>`}).join('');$('floorMark').classList.toggle('on',stateId==='omtal-02'||stateId==='omtal-10')}
function updateDev(item){const state=states.get(stateId);$('devText').innerHTML=`상태: <b>${stateId}</b> ${state?.name||''}<br>표시: ${queueIndex+1}/${queue.length}, 문장 ${pageIndex+1}/${item.pages.length}<br>원전 표시: ${shownLines.size}/24행<br>연속 회피: ${ctx.cycle}/9, 성공 ${ctx.successes}, 실패 ${ctx.failures}`}
function recovery(message){showModal('인식 복구',message,[['인식 확인 다시 시작',()=>{hideModal();if(stateId==='omtal-02')enter('omtal-02');else enter('omtal-10')}],['체험 종료',()=>{hideModal();goHome()},'primary']])}
function showModal(title,text,actions){$('modalTitle').textContent=title;$('modalText').textContent=text;$('modalActions').innerHTML='';actions.forEach(([label,fn,cls])=>{const b=document.createElement('button');b.textContent=label;b.className=cls||'';b.onclick=fn;$('modalActions').appendChild(b)});$('modal').classList.add('on')}
function hideModal(){$('modal').classList.remove('on')}function confirmQuit(){showModal('체험을 그만둘까요?','현재 진행은 저장되지 않습니다.',[['계속하기',hideModal],['그만두기',()=>{hideModal();goHome()},'primary']])}
function start(){ctx={recognitionFails:0,pushRecognitionFails:0,firstPushFails:0,finalFails:0,cycle:0,retry:0,successes:0,failures:0,finalFailure:false};shownLines=new Set();$('home').classList.remove('on');$('play').classList.add('on');enter('omtal-01')}
function goHome(){$('play').classList.remove('on');$('home').classList.add('on');$('dev').classList.remove('on')}
document.querySelector('[data-start=omtal]').onclick=start;$('next').onclick=nextItem;$('prevSentence').onclick=prevSentence;$('quit').onclick=confirmQuit;$('devToggle').onclick=()=>$('dev').classList.toggle('on');document.addEventListener('keydown',e=>{if($('modal').classList.contains('on'))return;if(e.key==='d'||e.key==='D')$('dev').classList.toggle('on');if(e.key==='ArrowRight'&&$('next').style.display!=='none')nextItem();if(e.key==='ArrowLeft')prevSentence();const buttons=$('choices').querySelectorAll('button');if(/^\d$/.test(e.key)&&buttons[Number(e.key)-1])buttons[Number(e.key)-1].click()});
</script>
</body></html>
