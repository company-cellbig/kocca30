<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>덧뵈기 · 나만의 탈춤 프로토타입</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f0da;
      --muted: #c9bea4;
      --red: #e14e3f;
      --gold: #f0b849;
      --green: #43a477;
      --panel: rgba(18, 17, 22, .94);
      --line: rgba(255, 239, 201, .22);
      --shadow: 0 22px 60px rgba(0, 0, 0, .42);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0d0c10;
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    button { font: inherit; }

    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 15%, rgba(225, 78, 63, .18), transparent 34%),
        repeating-linear-gradient(135deg, rgba(255,255,255,.016) 0 2px, transparent 2px 8px),
        #0d0c10;
    }

    #kiosk {
      position: relative;
      width: min(100vw, 177.777vh);
      height: min(56.25vw, 100vh);
      min-width: 960px;
      min-height: 540px;
      overflow: hidden;
      background: #15131a;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .screen { position: absolute; inset: 0; display: none; }
    .screen.active { display: flex; }

    /* 시작 화면 */
    #home {
      flex-direction: column;
      padding: 4.4% 5.5% 4.2%;
      background:
        linear-gradient(rgba(12, 10, 13, .44), rgba(12, 10, 13, .7)),
        radial-gradient(circle at 16% 28%, rgba(240, 184, 73, .18), transparent 25%),
        radial-gradient(circle at 85% 20%, rgba(67, 164, 119, .15), transparent 26%),
        linear-gradient(150deg, #32232a, #17151a 52%, #242228);
    }

    .brand-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 4%; }
    .eyebrow { margin: 0 0 .55em; color: var(--gold); font-size: clamp(14px, 1.25vw, 24px); font-weight: 800; letter-spacing: .18em; }
    h1 { margin: 0; font-family: Georgia, "Batang", serif; font-size: clamp(38px, 4.2vw, 80px); line-height: 1.04; letter-spacing: -.05em; }
    .intro { max-width: 35%; margin: 0 0 .4%; color: var(--muted); font-size: clamp(15px, 1.15vw, 22px); line-height: 1.55; }

    .scene-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.45%; flex: 1; margin-top: 3.2%; min-height: 0; }
    .scene-card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 0;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      background: #29252b;
      transition: transform .22s ease, border-color .22s ease, filter .22s ease;
    }
    .scene-card:hover, .scene-card:focus-visible { transform: translateY(-8px); border-color: var(--gold); filter: brightness(1.06); outline: none; }
    .card-art { position: absolute; inset: 0; background: var(--card-bg); }
    .card-art::before {
      content: ""; position: absolute; width: 45%; aspect-ratio: 1; left: 27%; top: 11%; border-radius: 48% 52% 46% 54%;
      background: var(--mask); box-shadow: inset -14px -10px 0 rgba(0,0,0,.18), 0 12px 30px rgba(0,0,0,.28);
      transform: rotate(var(--tilt));
    }
    .card-art::after {
      content: ""; position: absolute; left: 34%; top: 29%; width: 8%; height: 5%; border-radius: 50%;
      background: #171319; box-shadow: 88px 0 #171319, 44px 54px 0 -4px #171319;
      transform: rotate(var(--tilt));
    }
    .card-content { position: absolute; inset: auto 0 0; z-index: 2; padding: 14% 8% 7%; background: linear-gradient(transparent, rgba(10,9,12,.94) 38%); }
    .card-no { color: var(--gold); font-size: clamp(12px, .86vw, 17px); font-weight: 900; letter-spacing: .16em; }
    .card-content h2 { margin: .2em 0 .18em; font-size: clamp(25px, 2.35vw, 45px); letter-spacing: -.045em; }
    .card-content p { margin: 0 0 .85em; color: #ded5c2; font-size: clamp(13px, .96vw, 18px); line-height: 1.45; }
    .role-chip { display: inline-flex; gap: .55em; align-items: center; padding: .45em .72em; border-radius: 999px; background: rgba(255,255,255,.1); font-size: clamp(12px, .82vw, 16px); }
    .role-chip b { color: var(--gold); }

    /* 체험 화면 */
    #play { flex-direction: column; background: #18131a; }
    .topbar {
      position: absolute; z-index: 20; left: 2.3%; right: 2.3%; top: 2.2%; height: 7%;
      display: flex; align-items: center; justify-content: space-between;
    }
    .top-title { display: flex; align-items: center; gap: 1em; font-size: clamp(15px, 1.15vw, 22px); font-weight: 850; }
    .top-title small { color: var(--gold); letter-spacing: .12em; }
    .progress { width: 23%; height: 8px; overflow: hidden; border-radius: 10px; background: rgba(255,255,255,.14); }
    .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), var(--red)); transition: width .4s ease; }
    .stage {
      position: absolute; inset: 0 0 21%;
      overflow: hidden;
      background:
        linear-gradient(rgba(21,14,18,.1), rgba(21,14,18,.3)),
        radial-gradient(ellipse at 50% 80%, rgba(247,194,98,.27), transparent 46%),
        linear-gradient(#293039 0 56%, #6a4a36 56% 59%, #272026 59%);
    }
    .stage::before {
      content: ""; position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(8,8,12,.72), transparent 17% 83%, rgba(8,8,12,.72)),
        repeating-linear-gradient(90deg, transparent 0 14.7%, rgba(255,255,255,.035) 14.7% 15%);
      pointer-events: none;
    }
    .stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 17%; background: radial-gradient(ellipse at center, rgba(0,0,0,.08), rgba(0,0,0,.5)); }

    .curtain { position: absolute; z-index: 8; top: 0; width: 15%; height: 75%; background: linear-gradient(90deg, #4b1821, #962d31 42%, #4f151d); filter: drop-shadow(10px 8px 10px rgba(0,0,0,.34)); }
    .curtain.left { left: 0; clip-path: polygon(0 0,100% 0,76% 100%,0 91%); }
    .curtain.right { right: 0; transform: scaleX(-1); clip-path: polygon(0 0,100% 0,76% 100%,0 91%); }
    .stage-label { position: absolute; z-index: 7; top: 11%; left: 50%; transform: translateX(-50%); color: rgba(255,240,212,.7); font-family: Georgia,"Batang",serif; font-size: clamp(18px, 1.65vw, 31px); letter-spacing: .28em; white-space: nowrap; }

    .cast { position: absolute; inset: 0; z-index: 10; }
    .actor {
      --x: 50%; --y: 58%; --scale: 1;
      position: absolute; left: var(--x); top: var(--y); width: 12%; aspect-ratio: .62;
      transform: translate(-50%, -50%) scale(var(--scale)); transform-origin: 50% 85%;
      margin: 0; padding: 0; border: 0; color: inherit; background: transparent;
      opacity: 0; pointer-events: none; transition: left .55s ease, top .55s ease, opacity .35s ease, transform .45s ease, filter .25s ease;
    }
    .actor.show { opacity: 1; }
    .actor.dim { filter: brightness(.55) saturate(.7); --scale: .82; }
    .actor.focus { --scale: 1.12; filter: drop-shadow(0 0 18px rgba(240,184,73,.42)); }
    .actor.targetable { pointer-events: auto; cursor: pointer; }
    .actor.targetable:hover .body, .actor.targetable:focus-visible .body { outline: 6px solid var(--gold); outline-offset: 8px; }
    .body { position: absolute; left: 18%; right: 18%; top: 38%; bottom: 0; border-radius: 38% 38% 18% 18%; background: var(--robe, #8a3d39); box-shadow: inset -15px -8px rgba(0,0,0,.18), 0 16px 22px rgba(0,0,0,.3); }
    .body::after { content: ""; position: absolute; left: 47%; top: 0; bottom: 0; width: 4px; background: rgba(255,235,195,.28); }
    .head { position: absolute; z-index: 3; left: 22%; top: 5%; width: 56%; aspect-ratio: .9; border-radius: 46% 54% 50% 50%; background: var(--face, #e8c785); box-shadow: inset -10px -8px rgba(0,0,0,.16), 0 9px 15px rgba(0,0,0,.28); }
    .head::before { content: ""; position: absolute; left: 18%; right: 18%; top: 38%; height: 8%; border-radius: 50%; background: #211820; box-shadow: 0 20px 0 -3px #6d2021; }
    .head::after { content: ""; position: absolute; left: 48%; top: 15%; width: 8%; height: 58%; border-radius: 50%; background: rgba(116,61,45,.38); transform: rotate(-8deg); }
    .arm { position: absolute; z-index: -1; top: 43%; width: 22%; height: 44%; border-radius: 999px; background: var(--robe,#8a3d39); transform-origin: 50% 10%; }
    .arm.a { left: 5%; transform: rotate(18deg); }
    .arm.b { right: 5%; transform: rotate(-18deg); }
    .actor.action .arm.a { animation: armA .7s ease-in-out infinite alternate; }
    .actor.action .arm.b { animation: armB .7s ease-in-out infinite alternate; }
    .actor.bounce { animation: bounce .55s ease-in-out infinite alternate; }
    .actor.shake { animation: shake .2s linear 3; }
    .actor.spin { animation: spin .75s ease-in-out; }
    .nameplate { position: absolute; left: 50%; bottom: -9%; transform: translateX(-50%); padding: .28em .65em; border-radius: 999px; background: rgba(13,12,16,.82); color: #fff5dd; font-size: clamp(11px, .78vw, 15px); font-weight: 800; white-space: nowrap; }

    .actor[data-role="jangsoe"] { --robe:#2e7164; --face:#ddb67d; }
    .actor[data-role="kkeoksoe"] { --robe:#315b86; --face:#e6b64f; }
    .actor[data-role="omtal"] { --robe:#872c34; --face:#c94b3c; }
    .actor[data-role="saennim"] { --robe:#77548c; --face:#ead6b3; }
    .actor[data-role="malttugi"] { --robe:#2f6d8d; --face:#bd4938; }
    .actor[data-role="jaebi"] { --robe:#765d37; --face:#d7ad78; }
    .actor[data-role="old"] { --robe:#6a687f; --face:#cfae88; }
    .actor[data-role="meokjung"] { --robe:#6a5231; --face:#dbbd82; }
    .actor[data-role="chv"] { --robe:#9c473b; --face:#d76d3e; }
    .actor[data-role^="pijori"] { --robe:#a35f82; --face:#efd1b0; }

    .waiting-badge { position: absolute; z-index: 9; right: 4%; top: 16%; display: none; align-items: center; gap: .65em; padding: .6em .9em; border: 1px solid var(--line); border-radius: 999px; background: rgba(12,11,15,.74); color: var(--muted); font-size: clamp(12px, .86vw, 17px); }
    .waiting-badge.show { display: flex; }
    .waiting-badge i { width: .7em; height: .7em; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px var(--gold); }

    .cue { position: absolute; z-index: 16; left: 50%; top: 43%; transform: translate(-50%,-50%); display: none; text-align: center; }
    .cue.show { display: block; animation: cueIn .28s ease-out; }
    .cue strong { display: block; font-size: clamp(48px, 6vw, 114px); line-height: 1; text-shadow: 0 8px 24px rgba(0,0,0,.55); }
    .cue span { display: inline-block; margin-top: .75em; padding: .45em .85em; border-radius: 999px; background: rgba(10,9,12,.78); color: var(--gold); font-size: clamp(14px, 1.05vw, 20px); font-weight: 900; }

    .input-zone {
      position: absolute; z-index: 30; left: 3%; right: 3%; bottom: 23.3%; min-height: 10%;
      display: none; align-items: center; justify-content: center; gap: 1%; pointer-events: none;
    }
    .input-zone.show { display: flex; pointer-events: auto; }
    .input-btn {
      min-width: 13%; min-height: 68px; padding: .75em 1.35em; border: 2px solid rgba(255,255,255,.27); border-radius: 18px;
      color: var(--ink); background: rgba(22,19,25,.9); cursor: pointer; font-size: clamp(15px, 1.05vw, 21px); font-weight: 850;
      transition: transform .16s, border-color .16s, background .16s;
    }
    .input-btn:hover, .input-btn:focus-visible { transform: scale(1.045); border-color: var(--gold); background: rgba(92,61,38,.94); outline: none; }
    .input-btn.primary { background: #8f302f; }

    .dialogue {
      position: absolute; z-index: 25; left: 0; right: 0; bottom: 0; height: 21%;
      display: grid; grid-template-columns: 15% 1fr auto; align-items: center; gap: 2%;
      padding: 1.7% 3.2%; border-top: 2px solid rgba(240,184,73,.4); background: var(--panel);
    }
    .speaker { color: var(--gold); font-size: clamp(19px, 1.55vw, 30px); font-weight: 900; }
    .speaker.guide { color: #83d8b1; }
    .line { font-size: clamp(22px, 1.9vw, 38px); font-weight: 720; line-height: 1.35; letter-spacing: -.025em; }
    .advance {
      min-width: 112px; padding: .8em 1em; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: rgba(255,255,255,.08); cursor: pointer; font-weight: 850;
    }
    .advance:hover { border-color: var(--gold); }

    .prototype-tools {
      position: absolute; z-index: 40; top: 10%; left: 2.2%; display: flex; flex-direction: column; gap: 8px;
    }
    .tool-btn { width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 50%; color: var(--ink); background: rgba(10,9,12,.72); cursor: pointer; font-weight: 900; }
    .tool-btn:hover { background: #7d302e; }
    .dev-note { position: absolute; z-index: 40; top: 10.5%; right: 2.2%; padding: .45em .75em; border-radius: 8px; color: #cfc6b3; background: rgba(10,9,12,.6); font-size: clamp(10px, .7vw, 13px); }

    .result-flash { position: absolute; z-index: 32; inset: 0 0 21%; display: none; place-items: center; pointer-events: none; background: rgba(15,12,16,.2); }
    .result-flash.show { display: grid; animation: fadeResult 1.05s ease both; }
    .result-flash span { padding: .35em .7em; border-radius: 14px; background: rgba(16,14,18,.9); color: var(--gold); font-family: Georgia,"Batang",serif; font-size: clamp(40px, 5vw, 94px); font-weight: 900; }

    @keyframes armA { to { transform: rotate(-42deg); } }
    @keyframes armB { to { transform: rotate(42deg); } }
    @keyframes bounce { to { transform: translate(-50%,-54%) scale(var(--scale)); } }
    @keyframes shake { 25% { margin-left:-12px } 75% { margin-left:12px } }
    @keyframes spin { 50% { transform: translate(-50%,-50%) rotate(12deg) scale(1.12); } }
    @keyframes cueIn { from { opacity:0; transform:translate(-50%,-50%) scale(.7) } }
    @keyframes fadeResult { 0%{opacity:0} 20%,70%{opacity:1} 100%{opacity:0} }

    @media (max-width: 1100px), (max-height: 620px) {
      #kiosk { min-width: 0; min-height: 0; }
      .input-btn { min-height: 48px; }
      .dialogue { grid-template-columns: 14% 1fr auto; }
      .advance { min-width: 82px; padding: .65em; }
    }
  </style>
</head>
<body>
  <main id="kiosk" aria-live="polite">
    <section id="home" class="screen active" aria-label="마당 선택">
      <div class="brand-row">
        <div>
          <p class="eyebrow">남사당 덧뵈기 체험</p>
          <h1>나만의 탈춤</h1>
        </div>
        <p class="intro">세 마당 중 하나를 고르면 선택한 마당의 처음부터 끝까지 이어서 체험합니다.</p>
      </div>
      <div class="scene-cards">
        <button class="scene-card" data-start="omtal" style="--card-bg:linear-gradient(155deg,#7c352f,#2c1f25);--mask:#ca4d3f;--tilt:-5deg">
          <span class="card-art"></span><span class="card-content"><span class="card-no">첫째 마당</span><h2>옴탈잡이</h2><p>좌우에서 달려드는 옴탈을 피하고 마지막 순간 밀어냅니다.</p><span class="role-chip">내 배역 <b>꺽쇠</b></span></span>
        </button>
        <button class="scene-card" data-start="saennim" style="--card-bg:linear-gradient(155deg,#5f4b7c,#241f2d);--mask:#e4d0aa;--tilt:3deg">
          <span class="card-art"></span><span class="card-content"><span class="card-no">둘째 마당</span><h2>샌님잡이</h2><p>샌님의 말에서 허점을 골라 말뚝이의 재담으로 받아칩니다.</p><span class="role-chip">내 배역 <b>말뚝이</b></span></span>
        </button>
        <button class="scene-card" data-start="meokjung" style="--card-bg:linear-gradient(155deg,#4c6848,#211f22);--mask:#d2b276;--tilt:-2deg">
          <span class="card-art"></span><span class="card-content"><span class="card-no">셋째 마당</span><h2>먹중잡이</h2><p>취발이가 나타난 뒤 몸짓이 달라진 인물을 찾아 지목합니다.</p><span class="role-chip">내 배역 <b>취발이</b></span></span>
        </button>
      </div>
    </section>

    <section id="play" class="screen" aria-label="탈춤 체험">
      <header class="topbar"><div class="top-title"><small id="sceneNo">첫째 마당</small><span id="sceneTitle">옴탈잡이</span></div><div class="progress"><i id="progressBar"></i></div></header>
      <div class="stage">
        <div class="curtain left"></div><div class="curtain right"></div><div class="stage-label">덧 뵈 기</div>
        <div id="cast" class="cast"></div>
        <div id="waiting" class="waiting-badge"><i></i><span></span></div>
        <div id="cue" class="cue"><strong></strong><span></span></div>
      </div>
      <div id="inputZone" class="input-zone"></div>
      <div id="resultFlash" class="result-flash"><span></span></div>
      <div class="dialogue"><div id="speaker" class="speaker">장쇠</div><div id="line" class="line"></div><button id="advance" class="advance">다음 ▶</button></div>
      <div class="prototype-tools"><button id="homeBtn" class="tool-btn" title="마당 선택으로">⌂</button><button id="prevBtn" class="tool-btn" title="이전 순서">‹</button></div>
      <div class="dev-note">화면 프로토타입 · ← → 이전/다음 · 숫자키 선택</div>
    </section>
  </main>

  <script>
    const actorNames = { jangsoe:'장쇠', kkeoksoe:'꺽쇠', omtal:'옴탈', saennim:'샌님', malttugi:'말뚝이', jaebi:'잽이', old:'노친네', meokjung:'먹중', chv:'취발이', pijoriA:'피조리', pijoriB:'피조리' };
    const A = (role, x, y=58, mods='show') => ({ role, x, y, mods });

    const scenes = {
      omtal: {
        no:'첫째 마당', title:'옴탈잡이',
        states:[
          {speaker:'장쇠', line:'여기는 옴탈이 꺽쇠를 몰아붙이는 마당입니다. 먼저 마당 전체를 살펴보세요.', actors:[A('jangsoe',20),A('kkeoksoe',50),A('omtal',80)], cue:['마당 전경','장쇠 · 꺽쇠 · 옴탈']},
          {speaker:'안내', line:'화면 중앙에 서서 몸을 좌우로 움직여 보세요.', actors:[A('jangsoe',18,59,'show dim'),A('kkeoksoe',50,56,'show focus action')], inputs:[['왼쪽 이동','ok'],['오른쪽 이동','ok']]},
          {speaker:'장쇠', line:'좋습니다. 꺽쇠는 당신의 움직임을 따라갑니다. 옴탈의 반대쪽으로 피하세요.', actors:[A('jangsoe',18,61,'show'),A('kkeoksoe',50,57,'show focus')], waiting:'옴탈이 무대 밖에서 기다립니다'},
          {speaker:'안내', line:'옴탈이 왼쪽에서 옵니다. 반대쪽으로 피하세요!', actors:[A('jangsoe',18,63,'show dim'),A('kkeoksoe',50,57,'show focus'),A('omtal',27,56,'show action')], inputs:[['← 왼쪽','miss'],['오른쪽 →','ok']]},
          {speaker:'장쇠', line:'잘 피했습니다. 이번에는 방향이 바뀝니다.', actors:[A('jangsoe',18,61,'show'),A('kkeoksoe',68,57,'show bounce'),A('omtal',30,57,'show shake')], flash:'회피 성공'},
          {speaker:'안내', line:'옴탈이 오른쪽에서 옵니다. 반대쪽으로 피하세요!', actors:[A('jangsoe',18,63,'show dim'),A('kkeoksoe',50,57,'show focus'),A('omtal',75,56,'show action')], inputs:[['← 왼쪽','ok'],['오른쪽 →','miss']]},
          {speaker:'장쇠', line:'옴탈의 접근 방향은 계속 달라집니다. 몸짓을 보고 판단하세요.', actors:[A('jangsoe',18,61,'show'),A('kkeoksoe',33,57,'show bounce'),A('omtal',74,57,'show shake')], flash:'연속 회피'},
          {speaker:'안내', line:'같은 접근이 다시 옵니다. 이번에도 반대쪽으로 피하세요.', actors:[A('jangsoe',18,63,'show dim'),A('kkeoksoe',50,57,'show focus'),A('omtal',26,56,'show action')], inputs:[['← 왼쪽','miss'],['오른쪽 →','ok']]},
          {speaker:'장쇠', line:'이제 피하기만 해서는 끝나지 않습니다. 팔을 앞으로 밀어내는 동작을 연습하세요.', actors:[A('jangsoe',22,57,'show action'),A('kkeoksoe',50,57,'show focus')], inputs:[['밀어내기 연습','ok']]},

          {speaker:'안내', line:'정체가 드러난 뒤 다시 몸이 달라진 인물을 가리키세요.', actors:[A('chv',20,56,'show'),A('meokjung',48,55,'show focus targetable'),A('pijoriA',68,57,'show targetable'),A('pijoriB',82,57,'show targetable')], inputs:[['먹중 지목','ok'],['피조리 지목','miss'],['지목하지 않기','skip']]},

          {speaker:'잽이', line:'말로 다투지 말고 춤으로 겨뤄 보시오!', actors:[A('jaebi',16,58,'show focus action'),A('chv',43,56,'show'),A('meokjung',67,56,'show')]},
          {speaker:'장쇠', line:'장단이 빨라지며 두 춤이 맞붙습니다.', actors:[A('jangsoe',12,63,'show dim'),A('jaebi',24,61,'show action'),A('chv',48,55,'show bounce action'),A('meokjung',72,55,'show bounce action')]},
          {speaker:'장쇠', line:'먹중은 취발이의 춤을 이기지 못하고 물러납니다.', actors:[A('jangsoe',12,63,'show'),A('chv',48,54,'show focus action'),A('meokjung',77,59,'show dim shake')], flash:'춤 대결 승리'},
          {speaker:'장쇠', line:'먹중이 취발이의 코를 건드리고 달아납니다. 잠시 뒤 취발이가 아픔을 알아챕니다.', actors:[A('jangsoe',12,63,'show dim'),A('chv',48,56,'show shake'),A('meokjung',86,57,'show action')]},
          {speaker:'장쇠', line:'갈라졌던 피조리들이 다시 모여 나란히 춤춥니다.', actors:[A('jangsoe',12,63,'show'),A('chv',32,56,'show bounce'),A('pijoriA',56,56,'show bounce'),A('pijoriB',74,56,'show bounce')]},
          {speaker:'장쇠', line:'모든 출연진이 함께 춤추며 먹중잡이 한 마당을 끝냅니다.', actors:[A('jangsoe',12,58,'show bounce'),A('chv',30,56,'show bounce'),A('meokjung',48,58,'show dim'),A('pijoriA',66,56,'show bounce'),A('pijoriB',83,56,'show bounce')], inputs:[['마당 선택으로','home']]}
        ]
      }
    };

    const els = Object.fromEntries(['home','play','sceneNo','sceneTitle','progressBar','cast','waiting','cue','inputZone','resultFlash','speaker','line','advance','homeBtn','prevBtn'].map(id => [id, document.getElementById(id)]));
    let sceneKey = null, step = 0, locked = false, transitionTimer = null;

    function actorMarkup(a) {
      const name = actorNames[a.role] || a.role;
      const interactive = (a.mods || '').includes('targetable');
      const tag = interactive ? 'button' : 'div';
      const label = interactive ? ` aria-label="${name} 지목"` : ' aria-hidden="true"';
      return `<${tag} class="actor ${a.mods || 'show'}" data-role="${a.role}" style="--x:${a.x}%;--y:${a.y || 58}%"${label}><span class="head"></span><span class="body"><i class="arm a"></i><i class="arm b"></i></span><span class="nameplate">${name}</span></${tag}>`;
    }

    function render() {
      const scene = scenes[sceneKey], state = scene.states[step];
      els.sceneNo.textContent = scene.no;
      els.sceneTitle.textContent = scene.title;
      els.progressBar.style.width = `${((step + 1) / scene.states.length) * 100}%`;
      els.cast.innerHTML = (state.actors || []).map(actorMarkup).join('');
      els.cast.querySelectorAll('.actor.targetable').forEach(actor => {
        actor.addEventListener('click', () => choose(actor.dataset.role === 'meokjung' ? 'ok' : 'miss', `${actorNames[actor.dataset.role]} 지목`));
      });
      els.speaker.textContent = state.speaker;
      els.speaker.classList.toggle('guide', state.speaker === '안내');
      els.line.textContent = state.line;
      els.waiting.classList.toggle('show', !!state.waiting);
      els.waiting.querySelector('span').textContent = state.waiting || '';
      els.cue.classList.toggle('show', !!state.cue);
      els.cue.querySelector('strong').textContent = state.cue?.[0] || '';
      els.cue.querySelector('span').textContent = state.cue?.[1] || '';
      els.inputZone.innerHTML = '';
      els.inputZone.classList.toggle('show', !!state.inputs);
      (state.inputs || []).forEach(([label, result], i) => {
        const b = document.createElement('button');
        b.className = `input-btn ${result === 'ok' ? 'primary' : ''}`;
        b.textContent = `${i + 1}. ${label}`;
        b.onclick = () => choose(result, label);
        els.inputZone.appendChild(b);
      });
      els.advance.hidden = !!state.inputs;
      els.advance.textContent = step === scene.states.length - 1 ? '마침' : '다음 ▶';
      locked = false;
    }

    function flash(text) {
      if (!text) return;
      els.resultFlash.querySelector('span').textContent = text;
      els.resultFlash.classList.remove('show');
      void els.resultFlash.offsetWidth;
      els.resultFlash.classList.add('show');
    }

    function choose(result, label) {
      if (locked) return;
      if (result === 'home') return goHome();
      locked = true;
      if (result === 'miss') {
        flash('다시 살펴보세요');
        els.line.textContent = '방향이나 인물을 다시 확인해 보세요. 이 프로토타입에서는 한 번 더 선택할 수 있습니다.';
        setTimeout(() => { locked = false; }, 850);
        return;
      }
      if (result === 'soft') {
        flash('다른 표현을 살펴보세요');
        els.line.textContent = '그 선택으로는 말의 허점이 드러나지 않습니다. 다른 표현을 골라 보세요.';
        setTimeout(() => { locked = false; }, 850);
        return;
      }
      if (result === 'skip') {
        flash('원전 사건 계속');
        const expected = step;
        transitionTimer = setTimeout(() => {
          if (sceneKey && step === expected) { step = Math.min(step + 2, scenes[sceneKey].states.length - 1); render(); }
        }, 650);
        return;
      }
      flash('입력 확인');
      const expected = step;
      transitionTimer = setTimeout(() => next(expected), 650);
    }

    function next(expectedStep = null) {
      if (!sceneKey || (expectedStep !== null && step !== expectedStep) || (locked && expectedStep === null)) return;
      const scene = scenes[sceneKey];
      if (step < scene.states.length - 1) { step++; render(); const f = scene.states[step].flash; if (f) setTimeout(() => flash(f), 180); }
      else goHome();
    }

    function start(key) {
      sceneKey = key; step = 0;
      els.home.classList.remove('active'); els.play.classList.add('active');
      render();
    }

    function goHome() {
      clearTimeout(transitionTimer); transitionTimer = null;
      sceneKey = null; step = 0;
      els.play.classList.remove('active'); els.home.classList.add('active');
    }

    document.querySelectorAll('[data-start]').forEach(b => b.addEventListener('click', () => start(b.dataset.start)));
    els.advance.addEventListener('click', next);
    els.homeBtn.addEventListener('click', goHome);
    els.prevBtn.addEventListener('click', () => { if (!locked && sceneKey && step > 0) { clearTimeout(transitionTimer); transitionTimer = null; step--; render(); } });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') return goHome();
      if (!sceneKey) {
        if (['1','2','3'].includes(e.key)) start(['omtal','saennim','meokjung'][Number(e.key)-1]);
        return;
      }
      if (e.key === 'ArrowRight' && !els.advance.hidden) next();
      if (e.key === 'ArrowLeft' && !locked && step > 0) { clearTimeout(transitionTimer); transitionTimer = null; step--; render(); }
      const buttons = [...els.inputZone.querySelectorAll('button')];
      if (!locked && /^[1-9]$/.test(e.key) && buttons[Number(e.key)-1]) buttons[Number(e.key)-1].click();
    });
  </script>
